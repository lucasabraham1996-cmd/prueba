<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Talleres - Único Grande</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (UMD Globals) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,900&display=swap');
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #00102b; /* Azul muy oscuro base */
            color: white;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Fondo Geométrico Estilo Talleres */
        .bg-matador {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                linear-gradient(135deg, rgba(0,27,72,0.9) 0%, rgba(0,16,43,0.95) 100%),
                repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 2px, transparent 2px, transparent 10px),
                radial-gradient(circle at 10% 20%, rgba(0,70,160,0.4) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0,70,160,0.3) 0%, transparent 40%);
            background-size: cover;
        }
        
        /* Formas decorativas sutiles */
        .bg-shape {
            position: fixed;
            opacity: 0.1;
            z-index: -1;
            pointer-events: none;
        }

        /* Glassmorphism Classes */
        .glass-card {
            background: rgba(13, 25, 48, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1rem;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }
        
        .glass-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Animaciones */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        
        /* Hide Scrollbar */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>
    <div class="bg-matador"></div>
    <!-- Formas geométricas decorativas -->
    <div class="bg-shape" style="top: 10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, #0044cc 0%, transparent 70%);"></div>
    <div class="bg-shape" style="bottom: -10%; right: -10%; width: 60vw; height: 60vw; background: radial-gradient(circle, #001b48 0%, transparent 70%); border: 2px solid rgba(255,255,255,0.05); border-radius: 50%;"></div>
    
    <div id="root"></div>

    <!-- Script Principal -->
    <script type="text/babel" data-type="module">
        // --- Firebase Imports ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, setDoc, getDoc, updateDoc, increment, doc, query, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Configuración Segura para GitHub ---
        // Si __firebase_config no existe (GitHub), usa un objeto vacío para no romper el script.
        // IMPORTANTE: Para que funcione en GitHub, debes reemplazar el objeto vacío {} dentro del catch 
        // con tu configuración real de Firebase: { apiKey: "...", authDomain: "...", ... }
        let firebaseConfig;
        try {
            firebaseConfig = JSON.parse(__firebase_config);
        } catch (e) {
            console.warn("Configuración de Firebase no detectada automáticamente.");
            firebaseConfig = {}; // Poner aquí tu config real para producción
        }
        
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        let app, auth, db;
        try {
            if (firebaseConfig && Object.keys(firebaseConfig).length > 0) {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
            } else {
                console.warn("Firebase no inicializado: Faltan credenciales.");
            }
        } catch (e) {
            console.error("Error inicializando Firebase:", e);
        }

        // --- Iconos SVG Manuales ---
        const IconBase = ({ size = 24, className = "", children, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>{children}</svg>
        );

        const Users = (props) => <IconBase {...props}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconBase>;
        const Plus = (props) => <IconBase {...props}><path d="M5 12h14"/><path d="M12 5v14"/></IconBase>;
        const Trash2 = (props) => <IconBase {...props}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></IconBase>;
        const Lock = (props) => <IconBase {...props}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></IconBase>;
        const Unlock = (props) => <IconBase {...props}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></IconBase>;
        const Calendar = (props) => <IconBase {...props}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></IconBase>;
        const Shirt = (props) => <IconBase {...props}><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></IconBase>;
        const Plane = (props) => <IconBase {...props}><path d="M2 12h20"/><path d="M13 2l9 10-9 10"/><path d="M2 12l5-5m-5 5l5 5"/></IconBase>; 
        const Home = (props) => <IconBase {...props}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></IconBase>;
        const Clock = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></IconBase>;
        const Edit2 = (props) => <IconBase {...props}><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></IconBase>;
        const List = (props) => <IconBase {...props}><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></IconBase>;
        const ArrowLeftRight = (props) => <IconBase {...props}><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></IconBase>;
        const Trophy = (props) => <IconBase {...props}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></IconBase>;
        const UserPlus = (props) => <IconBase {...props}><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></IconBase>;
        const UserMinus = (props) => <IconBase {...props}><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="23" y1="11" x2="17" y2="11"/></IconBase>;
        const Newspaper = (props) => <IconBase {...props}><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/></IconBase>;
        const Instagram = (props) => <IconBase {...props}><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></IconBase>;
        const Twitter = (props) => <IconBase {...props}><path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"/></IconBase>;
        const Eye = (props) => <IconBase {...props}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></IconBase>;

        // --- Mapeo de Escudos ---
        const TEAM_LOGOS = {
            "Newell's": "https://i.postimg.cc/kGW21Z2v/Newells.png",
            "Vélez": "https://i.postimg.cc/9X9wQ4LR/Velez.png",
            "Platense": "https://i.postimg.cc/sXkBJygL/Platense.png",
            "Lanús": "https://i.postimg.cc/zBsLk5Gd/Lanus.png",
            "Gimnasia (Mendoza)": "https://i.postimg.cc/DZ9WcFwd/gimnasiamendoza-copia.png",
            "Rosario Central": "https://i.postimg.cc/4ypYLMY2/Rosario-Central.png",
            "Central Córdoba": "https://i.postimg.cc/j5wwNCtw/Central-Cordoba.png",
            "San Lorenzo": "https://i.postimg.cc/rs5DnbDY/San-Lorenzo.png",
            "Unión": "https://i.postimg.cc/nrqXR5sh/Union.png",
            "Instituto": "https://i.postimg.cc/SsBXGqxD/Instituto.png",
            "Belgrano": "https://i.postimg.cc/JnDDJtMs/Belgrano.png",
            "Independiente": "https://i.postimg.cc/50hHm12p/Independiente.png",
            "Boca": "https://i.postimg.cc/V6rrM5mb/Boca.png",
            "Defensa y Justicia": "https://i.postimg.cc/mDvcSRgF/Defensa.png",
            "Riestra": "https://i.postimg.cc/VvXJGTJ4/Riestra.png",
            "Estudiantes": "https://i.postimg.cc/k40Vy9gW/Estudiantes-LP.png",
            "Argentino de Merlo": "https://i.postimg.cc/mDzzMhBB/Argentino-de-Merlo.png",
            "Talleres": "https://i.postimg.cc/Gtv47NBw/Talleres.png",
            "Talleres (Cba.)": "https://i.postimg.cc/Gtv47NBw/Talleres.png",
            "River": "https://i.postimg.cc/Kjt1qV10/River.png",
            "Racing": "https://i.postimg.cc/gj3xS5xs/Racing.png",
            "Argentinos": "https://i.postimg.cc/KYs3RtSb/AAAJ.png",
            "Atl. Tucumán": "https://i.postimg.cc/Kjt1qVKx/Tucuman.png",
            "Banfield": "https://i.postimg.cc/6322RTtw/Banfield.png",
            "Barracas": "https://i.postimg.cc/nzjj7Mpc/Barracas.png",
            "Godoy Cruz": "https://i.postimg.cc/j5pWhKSh/Godoy-Cruz.png",
            "Huracán": "https://i.postimg.cc/852FbDzH/Huracan.png",
            "Ind. Rivadavia": "https://i.postimg.cc/Qt2BqsdM/CSIR.png",
            "Sarmiento": "https://i.postimg.cc/mk7PXqP5/Sarmiento.png",
            "Tigre": "https://i.postimg.cc/J0js6gyW/Tigre.png",
            "Aldosivi": "https://i.postimg.cc/Qt995Vhd/Aldosivi.png",
            "Sportivo Barracas": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Escudo_del_Club_Sportivo_Barracas.svg/1200px-Escudo_del_Club_Sportivo_Barracas.svg.png"
        };

        const getLogo = (name) => {
            if (TEAM_LOGOS[name]) return TEAM_LOGOS[name];
            const key = Object.keys(TEAM_LOGOS).find(k => name.includes(k));
            return key ? TEAM_LOGOS[key] : 'https://upload.wikimedia.org/wikipedia/commons/a/ac/No_image_available.svg';
        };

        const INITIAL_SQUAD = [
            { id: 'p1', name: 'Guido Herrera', position: 'Arquero', number: '22', photo: 'https://www.clubtalleres.com.ar/wp-content/uploads/2022/01/Guido-Herrera-2.png' },
            { id: 'p3', name: 'Matías Catalán', position: 'Defensor', number: '4', photo: 'https://www.clubtalleres.com.ar/wp-content/uploads/2022/01/Matias-Catalan.png' },
            { id: 'p12', name: 'Rubén Botta', position: 'Mediocampista', number: '20', photo: 'https://www.clubtalleres.com.ar/wp-content/uploads/2024/01/Ruben-Botta-1.png' },
            { id: 'p14', name: 'Federico Girotti', position: 'Delantero', number: '9', photo: 'https://www.clubtalleres.com.ar/wp-content/uploads/2022/01/Federico-Girotti.png' },
        ];

        const INITIAL_FIXTURE = [
            { id: 'f1', rival: "Newell's", condition: 'Local' },
            { id: 'f2', rival: "Vélez", condition: 'Visitante' },
            { id: 'f3', rival: "Platense", condition: 'Local' },
            { id: 'f4', rival: "Lanús", condition: 'Visitante' },
            { id: 'f5', rival: "Gimnasia (Mendoza)", condition: 'Local' },
            { id: 'f6', rival: "Rosario Central", condition: 'Visitante' },
            { id: 'f7', rival: "Central Córdoba", condition: 'Visitante' },
            { id: 'f8', rival: "San Lorenzo", condition: 'Local' },
            { id: 'f9', rival: "Unión", condition: 'Visitante' },
            { id: 'f10', rival: "Instituto", condition: 'Local' },
            { id: 'f11', rival: "Belgrano", condition: 'Visitante' },
            { id: 'f12', rival: "Independiente", condition: 'Visitante' },
            { id: 'f13', rival: "Boca", condition: 'Local' },
            { id: 'f14', rival: "Defensa y Justicia", condition: 'Visitante' },
            { id: 'f15', rival: "Riestra", condition: 'Local' },
            { id: 'f16', rival: "Estudiantes", condition: 'Visitante' },
        ];

        // --- Componentes UI ---
        const Button = ({ children, onClick, variant = "primary", className = "", disabled = false, size = "normal" }) => {
            const baseStyle = `rounded-lg font-bold transition-all duration-300 flex items-center justify-center gap-2 shadow-lg backdrop-blur-sm relative overflow-hidden group ${size === 'small' ? 'px-3 py-1 text-xs' : 'px-6 py-2'}`;
            const variants = {
                primary: "bg-blue-600/80 hover:bg-blue-500 text-white border border-blue-400/30",
                danger: "bg-red-600/60 hover:bg-red-500 text-white border border-red-400/30",
                ghost: "bg-white/5 hover:bg-white/10 text-gray-300 hover:text-white border border-white/10"
            };
            return (
                <button onClick={onClick} disabled={disabled} className={`${baseStyle} ${variants[variant]} ${className}`}>
                    <span className="relative z-10 flex items-center gap-2">{children}</span>
                    <div className="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 pointer-events-none"></div>
                </button>
            );
        };

        const Input = (props) => (
            <input {...props} className="w-full glass-input rounded-lg px-4 py-2 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all backdrop-blur-sm shadow-inner" />
        );

        const Select = ({ children, ...props }) => (
            <select {...props} className="w-full glass-input rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all backdrop-blur-sm appearance-none shadow-inner">
                {children}
            </select>
        );

        // --- APP Principal ---
        function App() {
            const [user, setUser] = React.useState(null);
            const [isAdmin, setIsAdmin] = React.useState(false);
            const [activeTab, setActiveTab] = React.useState('inicio');
            const [aperturaSubTab, setAperturaSubTab] = React.useState('fixture');
            const [items, setItems] = React.useState([]);
            const [fixtureMetadata, setFixtureMetadata] = React.useState({});
            const [loading, setLoading] = React.useState(true);
            const [visits, setVisits] = React.useState(1913);

            // Estados de Edición
            const [isFormOpen, setIsFormOpen] = React.useState(false);
            const [newItemData, setNewItemData] = React.useState({});
            const [editingMatchId, setEditingMatchId] = React.useState(null);
            const [matchEditData, setMatchEditData] = React.useState({});
            const [editingItemId, setEditingItemId] = React.useState(null);

            React.useEffect(() => {
                // Verificar modo Admin via URL (?admin=true)
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('admin') === 'true') {
                    setIsAdmin(true);
                }

                if (!auth) return; // Protección si Firebase no está configurado

                const initAuth = async () => {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                };
                initAuth();
                onAuthStateChanged(auth, (u) => setUser(u));
            }, []);

            React.useEffect(() => {
                if (!user || !db) {
                    setLoading(false); // Para mostrar la app aunque falle Firebase en GitHub
                    return;
                }
                
                const visitRef = doc(db, 'artifacts', appId, 'public', 'data', 'counters_v2', 'global');
                const updateVisits = async () => {
                    if (!sessionStorage.getItem('visited')) {
                        try {
                            await setDoc(visitRef, { count: increment(1) }, { merge: true });
                            sessionStorage.setItem('visited', 'true');
                        } catch(e) {}
                    }
                };
                updateVisits();
                
                const unsubVisits = onSnapshot(visitRef, (doc) => {
                    if (doc.exists()) setVisits(doc.data().count || 1913);
                });

                const qStats = query(collection(db, 'artifacts', appId, 'public', 'data', 'talleres_stats'));
                const unsubStats = onSnapshot(qStats, (snapshot) => {
                    setItems(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                
                const qFixture = query(collection(db, 'artifacts', appId, 'public', 'data', 'fixture_metadata'));
                const unsubFixture = onSnapshot(qFixture, (snapshot) => {
                    const metadata = {};
                    snapshot.docs.forEach(doc => { metadata[doc.id] = doc.data(); });
                    setFixtureMetadata(metadata);
                    setLoading(false);
                });
                
                return () => { unsubStats(); unsubFixture(); unsubVisits(); };
            }, [user]);

            const handleSaveItem = async (e) => {
                e.preventDefault();
                if (!user || !isAdmin || !db) return;
                try {
                    const payload = { ...newItemData, category: activeTab, updatedAt: serverTimestamp() };
                    if (!editingItemId) payload.createdAt = serverTimestamp();
                    
                    if (editingItemId) {
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'talleres_stats', editingItemId), payload, { merge: true });
                    } else {
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'talleres_stats'), payload);
                    }
                    setNewItemData({});
                    setEditingItemId(null);
                    setIsFormOpen(false);
                } catch (error) { console.error(error); }
            };

            const handleDeleteItem = async (id) => {
                if (!user || !isAdmin || !db) return;
                if (confirm('¿Borrar registro?')) {
                    try { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'talleres_stats', id)); } catch (e) { console.error(e); }
                }
            };

            const handleUpdateFixture = async (e) => {
                e.preventDefault();
                if (!user || !isAdmin || !editingMatchId || !db) return;
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'fixture_metadata', editingMatchId), { ...matchEditData, updatedAt: serverTimestamp() });
                    setEditingMatchId(null);
                    setMatchEditData({});
                } catch (e) { console.error(e); }
            };

            // Mock Data Generator para Posiciones (Todos en 0)
            const getPosicionesData = () => {
                // Filtramos Rosario Central y Belgrano
                const excludedTeams = ["Rosario Central", "Belgrano"];
                const teams = INITIAL_FIXTURE.map(m => m.rival).filter(t => !excludedTeams.includes(t));
                teams.push("Talleres"); // Agregar a Talleres
                
                // Generar datos EN CERO para todos
                return teams.map((team) => {
                    return {
                        name: team,
                        pts: 0,
                        pj: 0,
                        pg: 0,
                        pe: 0,
                        pp: 0,
                        gf: 0,
                        gc: 0,
                    };
                }).sort((a, b) => a.name.localeCompare(b.name)); // Orden alfabético inicial
            };

            const renderInicio = () => (
                <div className="space-y-6 animate-fade-in pb-12">
                    <div className="glass-card p-6 text-center bg-blue-900/60 border-blue-400/30 shadow-[0_0_50px_rgba(37,99,235,0.2)]">
                        <h2 className="text-2xl md:text-4xl font-black italic mb-2 text-white drop-shadow-md">BIENVENIDO AL MUNDO TALLERES</h2>
                        <p className="text-blue-200 text-sm md:text-base">Todas las estadísticas, plantel y novedades del Matador.</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">

                                                        <option value="baja">Baja</option>
                                                    </Select>
                                                    <Input placeholder={newItemData.type === 'alta' ? 'Llega de...' : 'Se va a...'} value={newItemData[newItemData.type === 'alta' ? 'from' : 'to'] || ''} onChange={e => setNewItemData({...newItemData, [newItemData.type === 'alta' ? 'from' : 'to']: e.target.value})} required />
                                                </div>
                                                <Input placeholder="URL Foto (https://...)" value={newItemData.photo || ''} onChange={e => setNewItemData({...newItemData, photo: e.target.value})} />
                                            </>
                                        )}
                                        <Button type="submit" className="mt-2">{editingItemId ? 'Actualizar' : 'Guardar'}</Button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* Botón Flotante Admin para Agregar */}
                        {isAdmin && !isFormOpen && (activeTab === 'plantel' || activeTab === 'mercado') && (
                            <button 
                                onClick={() => { setIsFormOpen(true); setEditingItemId(null); setNewItemData({}); }}
                                className="fixed bottom-6 right-6 w-14 h-14 bg-blue-600 rounded-full flex items-center justify-center shadow-[0_0_20px_blue] text-white z-40 hover:scale-110 transition-transform"
                            >
                                <Plus size={28} />
                            </button>
                        )}

                        <main className="min-h-[400px]">
                            {loading ? <div className="text-center py-20 text-blue-300 animate-pulse font-bold tracking-widest">CARGANDO AL MATADOR...</div> : (
                                <>
                                    {activeTab === 'inicio' && renderInicio()}
                                    {activeTab === 'apertura' && (
                                        <>
                                            <div className="flex gap-2 mb-4 bg-black/40 p-1 rounded-lg w-fit mx-auto md:mx-0">
                                                <button onClick={() => setAperturaSubTab('fixture')} className={`px-6 py-1.5 rounded-md text-xs font-bold transition-all ${aperturaSubTab === 'fixture' ? 'bg-blue-600 text-white shadow-lg' : 'text-gray-400'}`}>Fixture</button>
                                                <button onClick={() => setAperturaSubTab('posiciones')} className={`px-6 py-1.5 rounded-md text-xs font-bold transition-all ${aperturaSubTab === 'posiciones' ? 'bg-blue-600 text-white shadow-lg' : 'text-gray-400'}`}>Posiciones</button>
                                            </div>
                                            {aperturaSubTab === 'fixture' ? renderFixture() : renderPosiciones()}
                                        </>
                                    )}
                                    {activeTab === 'copa' && renderCopa()}
                                    {activeTab === 'plantel' && renderPlantel()}
                                    {activeTab === 'mercado' && renderMercado()}
                                </>
                            )}
                        </main>

                        <footer className="mt-12 text-center text-[10px] text-blue-300/40 py-6 border-t border-white/5 uppercase tracking-widest">
                            Diseñada para los hinchas de la T
                        </footer>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
