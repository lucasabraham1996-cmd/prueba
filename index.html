        const Clock = (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>} />;

        // --- CONFIGURACIÓN Y DATOS ---
        const SHEET_IDS = { aperturaA: "1611251790", aperturaB: "373546185", fixture: "1821474141", promedios: "2049246168", anual: "1789064309", plantel: "1357384010" };

        const ASSETS = { logo: "https://i.postimg.cc/GtKJrSqj/Logo.png", lpf: "https://i.postimg.cc/kMYPfhgD/Liga-Profesional-2026.png", placeholderUser: "https://www.svgrepo.com/show/335455/profile-default.svg" };
        const PLAYER_PHOTOS = { "tevez":"https://i.postimg.cc/FFpKbQqS/Carlos-Tevez.png","perez":"https://i.postimg.cc/yYN8vb4L/Pablo-Perez.png","schott":"https://i.postimg.cc/KvdWK6Jp/Augusto-Shcott.png","reynoso":"https://i.postimg.cc/CLW2Z3mt/Emanuel-Reynoso.png","chiavassa":"https://i.postimg.cc/9XbfPjSy/Emiliano-Chiavassa.png","girotti":"https://i.postimg.cc/28Ptqs2X/Federico-Girotti.png","baez":"https://i.postimg.cc/dtzf7b4g/Gabriel-Baez.png","herrera":"https://i.postimg.cc/PrB7LgSr/Guido-Herrera.png","albarracin":"https://i.postimg.cc/65DP7kM9/Gustavo-Albarracin.jpg","alastra":"https://i.postimg.cc/HsfNJq6j/Ingacio-Alastra.png","burrai":"https://i.postimg.cc/CLW2Z3cz/Javier-Burrai.png","florentin":"https://i.postimg.cc/MZ5G084P/Jeremias-Florentin.png","gallard":"https://i.postimg.cc/13wjDvd4/Jeremias-Gallard.jpg","mosqueira":"https://i.postimg.cc/x1M4L6ZX/Joaquin-Mosqueira.png","palomino":"https://i.postimg.cc/FH3B0T6d/Jose-Luis-Palomino.png","portilla":"https://i.postimg.cc/4xVSpW0V/Juan-Camilo-Portilla.png","rodriguez":"https://i.postimg.cc/52LR8sr8/Juan-Rodriguez.png","alfonso":"https://i.postimg.cc/qvy521Fx/Lucas-Alfonso.jpg","angulo":"https://i.postimg.cc/5tJkgwcz/Luis-Miguel-Angulo.png","sequeira":"https://i.postimg.cc/FKvnpjt3/Luis-Sequeira.png","caceres":"https://i.postimg.cc/1zSYBpx6/Mateo-Caceres.png","catalan":"https://i.postimg.cc/hGn3s9Fb/Matias-Catalan.png","galarza":"https://i.postimg.cc/Jh8dxbwq/Matias-Galarza.png","gomez":"https://i.postimg.cc/VNwHgjyG/Matias-Gomez.png","navarro":"https://i.postimg.cc/8CGn4h8X/Miguel-Navarro.png","bustos":"https://i.postimg.cc/8CGn4h8Y/Nahuel-Bustos.png","olmos":"https://i.postimg.cc/wBzb2h88/Olmos.jpg","pedano":"https://i.postimg.cc/d0FS68Pc/Pedano.jpg","puzzo":"https://i.postimg.cc/mr46jQfG/Puzzo.jpg","rick":"https://i.postimg.cc/0NCXBbxB/Rick.png","guth":"https://i.postimg.cc/6QhbmywP/Rodrigo-Guth.png","botta":"https://i.postimg.cc/25x9KVmP/Ruben-Botta.png","salas":"https://i.postimg.cc/wBk4G7HC/Salas.jpg","sanabria":"https://i.postimg.cc/wBk4G7gH/Sanabria.jpg","fernandez":"https://i.postimg.cc/TPcN4pfd/Santiago-Fernandez.png","barbi":"https://i.postimg.cc/jdjSZF09/Santino-Barbi.png","chamorro":"https://i.postimg.cc/25x9KVr1/Timoteo-Chamorro.png","ortegoza":"https://i.postimg.cc/4312Smsh/Ulises-Ortegoza.png","davila":"https://i.postimg.cc/kX5gfp3z/Valentin-Davila.png","depietri":"https://i.postimg.cc/2689RrS5/Valentin-Depietri.png","barticciotto":"https://i.postimg.cc/VsgN9cTn/Bruno-Barticciotto.png","valoyes":"https://i.postimg.cc/v8hm7dj9/Diego-Valoyes.png","lucero":"https://i.postimg.cc/9XbfPjSd/Facundo-Lucero.png","yennerich":"https://i.postimg.cc/h4sG8qw8/Franco-Yennerich.png","baroni":"https://i.postimg.cc/1RBz0ZTB/Giovani-Baroni.png","sforza":"https://i.postimg.cc/m2rg85fQ/Juan-Sforza.png","ortiz":"https://i.postimg.cc/vHmZ3NF7/Lautaro-Ortiz.png","ferrari":"https://i.postimg.cc/sD2gwNd9/Lucio-Ferrari.png","martinez":"https://i.postimg.cc/15z3JjhY/Ronaldo-Martinez.png" };
        const TEAM_LOGOS = { "Argentinos":"https://i.postimg.cc/kGJMKVwd/AAAJ.png","Aldosivi":"https://i.postimg.cc/0jk5D6ZP/Aldosivi.png","Merlo":"https://i.postimg.cc/BbSZH8N0/Argentino-de-Merlo.png","Banfield":"https://i.postimg.cc/x8fjMkgY/Banfield.png","Barracas":"https://i.postimg.cc/8cpkMFwk/Barracas.png","Belgrano":"https://i.postimg.cc/tJqRW1DC/Belgrano.png","Boca":"https://i.postimg.cc/4yWf5J2D/Boca.png","Central C":"https://i.postimg.cc/2y0kwzXR/Central-Cordoba.png","Rivadavia":"https://i.postimg.cc/prsWZ21v/CSIR.png","Defensa":"https://i.postimg.cc/sxTjcV03/Defensa.png","Armenio":"https://i.postimg.cc/T1td9RHG/Deportivo-Armenio.png","Estudiantes":"https://i.postimg.cc/J0prq1d0/Estudiantes-LP.png","Estudiantes (RC)":"https://i.postimg.cc/9FvHZ8WY/Estudiantes-RC.png","Gimnasia":"https://i.postimg.cc/7hKHVxQG/GELP.png","Gimnasia (M)":"https://i.postimg.cc/tCLGWSXv/Gimnasia-y-esgrima-(Mza).png","Godoy":"https://i.postimg.cc/fy8zKwg0/Godoy-Cruz.png","Huracan":"https://i.postimg.cc/tJBq5Xmx/Huracan.png","Huracán":"https://i.postimg.cc/tJBq5Xmx/Huracan.png","Independiente":"https://i.postimg.cc/VvKfRYHM/Independiente.png","Instituto":"https://i.postimg.cc/C5chNF6j/Instituto.png","Lanus":"https://i.postimg.cc/qBwv0LB1/Lanus.png","Lanús":"https://i.postimg.cc/qBwv0LB1/Lanus.png","Matienzo":"https://i.postimg.cc/bYgw8TY6/Matienzo-Monte-Guey.png","Miras":"https://i.postimg.cc/59g2139K/miras.png","Newell":"https://i.postimg.cc/ZYH5ZcYg/Newells.png","Platense":"https://i.postimg.cc/44PxZ5Nk/Platense.png","Racing":"https://i.postimg.cc/tRk4y5C0/Racing.png","Riestra":"https://i.postimg.cc/xj51YRT2/Riestra.png","River":"https://i.postimg.cc/mZjgRw2B/River.png","Rosario":"https://i.postimg.cc/ryjwcJFd/Rosario-Central.png","San Lorenzo":"https://i.postimg.cc/c4J4Jnr0/San-Lorenzo.png","Sarmiento":"https://i.postimg.cc/jdjdj7Ls/Sarmiento.png","San Martin":"https://i.postimg.cc/28585ZVy/SMSJ.png","San Martín":"https://i.postimg.cc/28585ZVy/SMSJ.png","Talleres":"https://i.postimg.cc/yYNYNZk0/Talleres.png","Tigre":"https://i.postimg.cc/VLNLNCdF/Tigre.png","Tucuman":"https://i.postimg.cc/vHmHmVc0/Tucuman.png","Tucumán":"https://i.postimg.cc/vHmHmVc0/Tucuman.png","Union":"https://i.postimg.cc/jdkqnS7P/Union.png","Unión":"https://i.postimg.cc/jdkqnS7P/Union.png","Velez":"https://i.postimg.cc/Kvsc38M5/Velez.png","Vélez":"https://i.postimg.cc/Kvsc38M5/Velez.png" };
        const POSITIONS = { "0ARQ":{label:"Arqueros",color:"bg-yellow-500",icon:Hand,abbr:"ARQ"},"1DEF":{label:"Defensores",color:"bg-blue-500",icon:Shield,abbr:"DEF"},"2MED":{label:"Mediocampistas",color:"bg-emerald-500",icon:Activity,abbr:"MED"},"2VOL":{label:"Volantes",color:"bg-green-500",icon:Activity,abbr:"VOL"},"3DEL":{label:"Delanteros",color:"bg-red-500",icon:Target,abbr:"DEL"} };
        const EXTRA_PLAYERS = [{nombre:"Facundo Lucero",numero:"14",puesto:"1DEF",edad:"20"},{nombre:"Lautaro Ortiz",numero:"16",puesto:"2MED",edad:"21"},{nombre:"Franco Yennerich",numero:"12",puesto:"0ARQ",edad:"22"},{nombre:"Lucio Ferrari",numero:"13",puesto:"1DEF",edad:"19"}];

        // --- HELPERS ---
        const cleanString = (s) => (!s ? "" : s.toString().replace(/\*/g, '').replace(/vs\./gi, '').replace(' (C)', '').trim());
        const shortName = (n) => { if(!n) return ""; const c=cleanString(n); const map={"Argentinos Juniors":"AAAJ","Central Córdoba (SdE)":"CCO","Defensa y Justicia":"DYJ","Estudiantes (LP)":"EDLP","Gimnasia (LP)":"GELP","Gimnasia (M)":"GEM","Godoy Cruz":"GOD","Independiente Rivadavia":"CSIR","Independiente":"CAI","Newell's":"NOB","Rosario Central":"CARC","San Lorenzo":"CASL","San Martín (SJ)":"SMSJ","Sarmiento (J)":"SAR","Talleres (C)":"CAT","Atlético Tucumán":"CAT","Vélez Sarsfield":"VEL","Boca Juniors":"BOC","River Plate":"RIV","Racing Club":"RAC","Huracán":"HUR","Lanús":"LAN","Banfield":"BAN","Platense":"PLA","Instituto":"IACC","Belgrano":"CAB","Unión":"UNI","Tigre":"TIG","Barracas Central":"BAR","Deportivo Riestra":"RIE"}; return map[c] || c.substring(0,3).toUpperCase(); };
        const getTeamLogo = (n) => { if(!n) return ASSETS.lpf; const k=Object.keys(TEAM_LOGOS).find(k=>n.toLowerCase().includes(k.toLowerCase())); return k?TEAM_LOGOS[k]:ASSETS.lpf; };
        const getPlayerPhoto = (n) => { if(!n) return null; const k=Object.keys(PLAYER_PHOTOS).find(x=>n.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").includes(x)); return k?PLAYER_PHOTOS[k]:null; };
        const getLastName = (fullName) => {
            if(!fullName) return "";
            const parts = fullName.trim().split(' ');
            if(fullName.includes(',')) return parts[0].replace(',','');
            return parts.length > 1 ? parts[parts.length - 1] : parts[0];
        };

        // --- PARSER ---
        const parseSheetData = (csv, type) => {
            if (!csv) return [];
            const lines = csv.split('\n').filter(l => l.trim() !== '');
            let hIdx = -1;
            const kw = { standings:['equipo','club','pos'], fixture:['fecha'], plantel:['jugador','nombre'] };
            const tKw = kw[type==='plantel'?'plantel':(type==='fixture'?'fixture':'standings')];
            for(let i=0; i<Math.min(lines.length,20); i++) { if(tKw.some(k=>lines[i].toLowerCase().includes(k))) { hIdx=i; break; } }
            if(hIdx===-1) hIdx=0;
            
            const splitCSV = (str) => { const m=str.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g); return m?m.map(x=>x.replace(/^"|"$/g,'').trim()):str.split(','); };
            const rH = splitCSV(lines[hIdx]).map(x=>x.toLowerCase());

            return lines.slice(hIdx+1).map(line => {
                const vals = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v=>v.trim().replace(/^"|"$/g,''));
                if(vals.every(v=>v==='')) return null;
                const row = {};
                if(type==='fixture') {
                    let rawA=vals[0]||"", rawB=vals[1]||"", rawC=vals[2]||"", rawD=vals[3]||"", rawE=vals[4]||"";
                    let f=rawA, dh="";
                    if(rawA.includes(';')) { const p=rawA.split(';'); f=p[0].trim(); dh=p[1].trim(); }
                    row.fechaDisplay=f; row.diaHora=dh; row.local=rawB; row.visitante=rawD; row.resultado=rawC.replace(/\*/g,''); row.info=rawE;
                } else if(type.includes('apertura') || type==='anual' || type==='promedios') {
                    row.pos = vals[rH.findIndex(h=>h.includes('pos')||h.includes('#'))]||vals[0];
                    row.equipo = vals[rH.findIndex(h=>h.includes('equipo')||h.includes('club'))]||vals[1];
                    row.pj = vals[rH.findIndex(h=>h.includes('pj')||h.includes('jug'))]||vals[2];
                    row.pts = vals[rH.findIndex(h=>h.includes('pts')||h.includes('punto'))]||vals[vals.length-1];
                    row.dif = vals[rH.findIndex(h=>h.includes('dif')||h.includes('dg'))]||"0";
                    if(type==='promedios') row.prom = vals[3] || "0.000"; else row.prom="0.000";
                } else {
                    row.nombre=vals[rH.findIndex(h=>h.includes('nombre')||h.includes('jug'))]||vals[1];
                    row.numero=vals[rH.findIndex(h=>h.includes('num')||h.includes('dorsal'))]||vals[0];
                    row.puesto=vals[rH.findIndex(h=>h.includes('puesto')||h.includes('pos'))]||vals[2];
                    row.edad=vals[rH.findIndex(h=>h.includes('edad'))]||null;
                    if(!row.puesto && vals.length>3) row.puesto=vals.find(v=>Object.keys(POSITIONS).includes(v))||"1DEF";
                }
                return row;
            }).filter(r=>r!==null);
        };

        // --- SUBCOMPONENTS ---
        const CopyIcon = ({color,size}) => (<div style={{width:size,height:size*1.3,backgroundColor:color,borderRadius:1}}></div>);
        
        const EmptyState = () => (
            <div className="p-10 flex flex-col items-center text-center text-white/40">
                <AlertCircle size={32} className="mb-2 opacity-50"/>
                <p>No hay datos disponibles en esta sección.</p>
            </div>
        );

        const StatBox = ({label, val, icon: IconComponent}) => (
            <div className="flex flex-col justify-center items-center py-1">
                <span className="text-white font-bold text-xs">{val}</span>
                <div className="flex items-center gap-1 text-[8px] text-gray-300 uppercase font-bold">
                    {IconComponent && <IconComponent size={8}/>}
                    {label}
                </div>
            </div>
        );

        const App = () => {
            const [tab, setTab] = useState('apertura');
            const [subTabAp, setSubTabAp] = useState('zonaA');
            const [subTabPl, setSubTabPl] = useState('jugadores');
            const [cache, setCache] = useState({});
            const [data, setData] = useState([]);
            const [dataB, setDataB] = useState([]);
            const [nextMatch, setNextMatch] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState("");
            const [selPlayer, setSelPlayer] = useState(null);
            const [ratingMatch, setRatingMatch] = useState(null);
            const [plantelFull, setPlantelFull] = useState([]);
            const [ratings, setRatings] = useState({});

            const fetchS = async (key, gid, type) => {
                if(cache[key]) return cache[key];
                const res = await fetch(`${BASE_SHEET_URL}?gid=${gid}&single=true&output=csv&t=${Date.now()}`);
                const txt = await res.text();
                const p = parseSheetData(txt, type);
                setCache(prev=>({...prev, [key]:p}));
                return p;
            };

            useEffect(() => {
                const load = async () => {
                    setLoading(true); setError(""); setData([]); setDataB([]);
                    try {
                        if(!cache['fixture']) {
                            const fData = await fetchS('fixture', SHEET_IDS.fixture, 'fixture');
                            // Fix: Ensure first match is caught even if result is empty
                            const upcoming = fData.find(m => {
                                const t = (m.local||"").toLowerCase();
                                const v = (m.visitante||"").toLowerCase();
                                const hasRes = m.resultado && /\d/.test(m.resultado);
                                // If it involves Talleres and has no numeric result, it's upcoming
                                return (t.includes('talleres') || v.includes('talleres')) && !hasRes;
                            });
                            setNextMatch(upcoming);
                        }

                        if(tab === 'apertura') {
                            const [da, db] = await Promise.all([
                                fetchS('aperturaA', SHEET_IDS.aperturaA, 'aperturaA'),
                                fetchS('aperturaB', SHEET_IDS.aperturaB, 'aperturaB')
                            ]);
                            setData(da); setDataB(db);
                        } else {
                            let d = await fetchS(tab, SHEET_IDS[tab], tab);
                            if(tab === 'plantel') {
                                d = [...d, ...EXTRA_PLAYERS];
                                setPlantelFull(d);
                            }
                            if(tab === 'fixture' && plantelFull.length === 0) {
                                fetchS('plantel', SHEET_IDS.plantel, 'plantel').then(p => setPlantelFull([...p, ...EXTRA_PLAYERS]));
                            }
                            setData(d);
                        }
                    } catch(e) { setError("Error cargando datos. Verifique conexión."); }
                    finally { setLoading(false); }
                };
                load();
            }, [tab]);

            const handleShareRatings = () => {
                if(!ratingMatch) return;
                const rival = ratingMatch.local.includes('Talleres') ? ratingMatch.visitante : ratingMatch.local;
                let text = `Mis calificaciones del partido #Talleres vs ${cleanString(rival)} son:\n`;
                const scoredPlayers = Object.entries(ratings).filter(([_, val]) => val !== "");
                if(scoredPlayers.length === 0) return alert("Califica al menos a un jugador.");
                scoredPlayers.forEach(([name, score]) => { text += `${getLastName(name)}: ${score}\n`; });
                text += `@TalleresMP`;
                window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`, '_blank');
                setRatingMatch(null); setRatings({});
            };

            const renderBanner = () => {
                if(!nextMatch) return null;
                return (
                    <div className="relative rounded-2xl overflow-hidden shadow-2xl border border-white/10 group mb-6 bg-blue-900">

                        <div className="relative p-5">
                            <div className="flex justify-between items-center mb-4">
                                <span className="bg-blue-600/30 text-blue-200 text-xs font-bold px-2 py-1 rounded border border-blue-500/30 animate-pulse">PRÓXIMO PARTIDO</span>
                                <span className="text-xs text-white/60 font-mono">{nextMatch.fechaDisplay}</span>
                            </div>
                            <div className="flex items-center justify-between px-2">
                                <div className="flex flex-col items-center gap-2 w-1/3">
                                    <img src={getTeamLogo(nextMatch.local)} className="h-12 w-12 object-contain" />
                                    <span className="text-xs font-bold text-center leading-tight">{cleanString(nextMatch.local)}</span>
                                </div>
                                <div className="flex flex-col items-center w-1/3 text-center">
                                    <span className="text-2xl font-black text-white/20">VS</span>
                                    <div className="mt-1 bg-black/40 px-3 py-1 rounded">
                                        <span className="block text-sm font-bold text-white">{nextMatch.diaHora || '-'}</span>
                                    </div>
                                </div>
                                <div className="flex flex-col items-center gap-2 w-1/3">
                                    <img src={getTeamLogo(nextMatch.visitante)} className="h-12 w-12 object-contain" />
                                    <span className="text-xs font-bold text-center leading-tight">{cleanString(nextMatch.visitante)}</span>
                                </div>
                            </div>
                            {nextMatch.info && <div className="mt-4 pt-2 border-t border-white/10 text-center"><span className="text-xs text-blue-300 flex items-center justify-center gap-1"><Shield size={12}/>{nextMatch.info}</span></div>}
                        </div>
                    </div>
                );
            };

            const renderTable = (items, title) => {
                if(!items?.length) return <EmptyState />;
                const isProm = tab === 'promedios', isAnual = tab === 'anual', isAp = tab === 'apertura';
                return (
                    <div className="bg-[#001e3d]/60 backdrop-blur-xl rounded-2xl border border-white/5 overflow-hidden shadow-xl mb-6">
                        {title && <div className="bg-blue-900/50 text-center py-2 text-sm font-bold text-blue-200 uppercase tracking-wider border-b border-white/10">{title}</div>}
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-black/20 text-xs text-blue-300 font-bold uppercase border-b border-white/5">
                                        <th className="p-3 text-center">#</th>
                                        <th className="p-3">Club</th>
                                        <th className="p-3 text-center">PJ</th>
                                        {isProm ? <th className="p-3 text-center">Temp</th> : <th className="p-3 text-center">Dif</th>}
                                        <th className="p-3 text-center">{isProm ? "Prom" : "Pts"}</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-white/5 text-sm">
                                    {items.map((r,i) => {
                                        if(!r.equipo) return null;
                                        const name = cleanString(r.equipo);
                                        const isT = name.includes("Talleres");
                                        const pos = parseInt(r.pos);
                                        const last = i === items.length - 1;
                                        let rowClass = isT ? "bg-blue-600/30 border-l-2 border-l-blue-500" : "";
                                        let posClass = "text-white/60";
                                        
                                        if(isAp && pos<=8) { if(!isT) rowClass="bg-green-500/10"; posClass="text-green-400 font-bold"; }
                                        if(isAnual) {
                                            if(pos<=4) { if(!isT) rowClass="bg-yellow-500/10"; posClass="text-yellow-400 font-bold"; }
                                            else if(pos<=9) { if(!isT) rowClass="bg-gray-400/10"; posClass="text-gray-300 font-bold"; }
                                            else if(last) { if(!isT) rowClass="bg-red-500/10"; posClass="text-red-400 font-bold"; }
                                        }
                                        if(isProm && last) { if(!isT) rowClass="bg-red-500/10"; posClass="text-red-400 font-bold"; }

                                        let promVal = r.prom;
                                        if(isProm) { const f = parseFloat(r.prom.replace(',','.')); if(!isNaN(f)) promVal = f.toFixed(3); }

                                        return (
                                            <tr key={i} className={`transition-colors ${rowClass}`}>
                                                <td className="p-3 text-center"><span className={posClass}>{r.pos}</span></td>

                                                    <img src={getTeamLogo(name)} className="h-6 w-6 object-contain"/>
                                                    <span className={`font-medium truncate ${isT?'text-white':'text-gray-300'}`}>
                                                        <span className="md:hidden">{shortName(name)}</span>
                                                        <span className="hidden md:inline">{name}</span>
                                                    </span>
                                                </td>
                                                <td className="p-3 text-center text-white/60 font-mono">{r.pj}</td>
                                                <td className="p-3 text-center text-white/60 font-mono text-xs">{isProm ? "24/26" : r.dif}</td>
                                                <td className="p-3 text-center font-bold text-white font-mono">{isProm ? promVal : r.pts}</td>
                                            </tr>

                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                )

            const renderFixture = () => {

                                    </div>
                                </div>
                            )

                    </div>

                        <div className="absolute bottom-14 left-0 right-0 z-20 flex justify-center">
                            <div className="bg-black/60 backdrop-blur-sm w-full py-1 text-center">
                                <h3 className="text-white font-black text-sm uppercase tracking-tight whitespace-normal px-1">{name}</h3>
                            </div>
                        </div>
                        <div className="absolute bottom-0 left-0 right-0 h-14 bg-black/80 backdrop-blur-md z-20 grid grid-cols-5 divide-x divide-white/10 border-t border-gray-500/50">
                            <StatBox label="PJ" val="0" /><StatBox label="G" val="0" icon={Activity}/><StatBox label="A" val="0" icon={Footprints}/>
                            <StatBox val="0" icon={()=><CopyIcon color="yellow" size={8}/>} /><StatBox val="0" icon={()=><CopyIcon color="red" size={8}/>} />

                    </div>

            return (
                <div className="min-h-screen pb-20 md:pb-10">

                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md animate-in fade-in">
                            <div className="relative w-full max-w-sm bg-gradient-to-br from-gray-800 to-black border border-gray-500 rounded-2xl overflow-hidden shadow-2xl">
                                <button onClick={()=>setSelPlayer(null)} className="absolute top-4 right-4 z-50 bg-black/50 p-2 rounded-full text-white"><X size={24}/></button>
                                <div className="relative h-64 bg-gradient-to-b from-blue-900 to-transparent">
                                    <img src={getPlayerPhoto(cleanString(selPlayer.nombre))||ASSETS.placeholderUser} className="w-full h-full object-contain drop-shadow-2xl"/>
                                </div>
                                <div className="p-6 text-center -mt-10 relative z-10">
                                    <div className="bg-black/80 backdrop-blur-xl rounded-lg py-2 mb-4 inline-block px-4 border border-white/10 shadow-lg">
                                        <h2 className="text-2xl font-black text-white uppercase leading-none">{cleanString(selPlayer.nombre)}</h2>
                                    </div>
                                    <p className="text-gray-400 text-sm font-bold uppercase tracking-widest mb-6">{selPlayer.puesto}</p>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="bg-white/5 rounded-xl p-3 border border-white/10"><p className="text-xs text-gray-400">Goles</p><p className="text-2xl font-bold text-white">0</p></div>
                                        <div className="bg-white/5 rounded-xl p-3 border border-white/10"><p className="text-xs text-gray-400">Asistencias</p><p className="text-2xl font-bold text-white">0</p></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {ratingMatch && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md animate-in fade-in">
                            <div className="relative w-full max-w-md bg-gray-900 border border-white/10 rounded-2xl overflow-hidden shadow-2xl max-h-[80vh] flex flex-col">
                                <div className="p-4 border-b border-white/10 flex justify-between items-center bg-gray-800">
                                    <div><h3 className="text-white font-bold">Calificar Rendimiento</h3><p className="text-xs text-gray-400">vs {cleanString(ratingMatch.visitante.includes('Talleres')?ratingMatch.local:ratingMatch.visitante)}</p></div>
                                    <button onClick={()=>setRatingMatch(null)} className="text-white"><X size={20}/></button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar">
                                    {plantelFull.length>0 ? plantelFull.filter(p=>!['ARQUEROS','DEFENSORES','MEDIOCAMPISTAS','DELANTEROS'].some(k=>(p.nombre||"").toUpperCase().includes(k))).map((p,i) => {
                                        const nm = cleanString(p.nombre);
                                        return (
                                            <div key={i} className="flex items-center justify-between bg-white/5 p-2 rounded-lg border border-white/5">
                                                <div className="flex items-center gap-3">
                                                    <img src={getPlayerPhoto(nm)||ASSETS.placeholderUser} className="w-8 h-8 rounded-full object-cover"/>
                                                    <p className="text-sm font-bold text-white">{nm}</p>
                                                </div>
                                                <select className="bg-black/40 text-white text-sm border border-white/20 rounded p-1" onChange={(e)=>setRatings({...ratings, [nm]:e.target.value})}>
                                                    <option value="">-</option>{[...Array(10)].map((_,n)=><option key={n+1} value={n+1}>{n+1}</option>)}
                                                </select>
                                            </div>
                                        )
                                    }) : <div className="text-center text-gray-500 py-10">Cargando...</div>}
                                </div>
                                <div className="p-4 border-t border-white/10 bg-gray-800">
                                    <button onClick={handleShareRatings} className="w-full py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-bold flex justify-center gap-2"><Twitter size={18}/> Compartir en Twitter</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <header className="sticky top-0 z-40 bg-[#001529]/90 backdrop-blur-md border-b border-white/10 shadow-lg">
                        <div className="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">

                                <img src={ASSETS.logo} className="h-10 w-10 object-contain drop-shadow-md" />
                                <div>
                                    <div className="flex items-center gap-3">
                                        <h1 className="font-bold text-lg tracking-wide uppercase leading-none">Talleres mi pasión</h1>

                                            <a href="#" className="text-pink-400 hover:text-white"><Instagram size={14}/></a>
                                            <a href="#" className="text-sky-400 hover:text-white"><Twitter size={14}/></a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <button onClick={()=>window.location.reload()} className="p-2 rounded-full hover:bg-white/5 transition-colors text-blue-200"><RefreshCw size={20}/></button>

                    </header>

                    <main className="max-w-4xl mx-auto px-4 py-6">
                        {renderBanner()}

                        <div className="overflow-x-auto pb-2 mb-4 scrollbar-hide">
                            <div className="flex gap-2 min-w-max">
                                {[{id:'apertura',label:'Apertura',icon:Trophy},{id:'anual',label:'Anual',icon:Activity},{id:'fixture',label:'Fixture',icon:Calendar},{id:'promedios',label:'Promedios',icon:AlertCircle},{id:'plantel',label:'Plantel',icon:Users}].map(t => (
                                    <button key={t.id} onClick={()=>setTab(t.id)} className={`flex items-center gap-2 px-4 py-2 rounded-full text-sm font-medium transition-all ${tab===t.id?'bg-blue-600 text-white shadow-lg':'bg-white/5 text-blue-200 hover:bg-white/10'}`}>
                                        <t.icon size={14}/>{t.label}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="animate-in fade-in slide-in-from-bottom-2 duration-300 min-h-[400px]">

                                <div className="flex flex-col items-center justify-center h-64 space-y-4"><div className="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div><span className="text-sm text-blue-300 animate-pulse">Cargando...</span></div>
                            ) : error ? (
                                <div className="p-10 text-center text-red-400"><AlertCircle className="mx-auto mb-2"/><p>{error}</p></div>
                            ) : (
                                <>
                                    {tab==='apertura' && (
                                        <>
                                            <div className="flex justify-center mb-6"><div className="bg-black/40 p-1 rounded-xl flex"><button onClick={()=>setSubTabAp('zonaA')} className={`px-6 py-2 rounded-lg text-sm font-bold ${subTabAp==='zonaA'?'bg-blue-600 text-white':'text-gray-400'}`}>Zona A</button><button onClick={()=>setSubTabAp('zonaB')} className={`px-6 py-2 rounded-lg text-sm font-bold ${subTabAp==='zonaB'?'bg-blue-600 text-white':'text-gray-400'}`}>Zona B</button></div></div>
                                            {renderTable(subTabAp==='zonaA'?data:dataB)}
                                        </>
                                    )}
                                    {(tab==='anual'||tab==='promedios') && renderTable(data)}
                                    {tab==='fixture' && renderFixture()}
                                    {tab==='plantel' && (
                                        <>
                                            <div className="flex justify-center mb-6"><div className="bg-black/40 p-1 rounded-xl flex"><button onClick={()=>setSubTabPl('jugadores')} className={`px-6 py-2 rounded-lg text-sm font-bold ${subTabPl==='jugadores'?'bg-blue-600 text-white':'text-gray-400'}`}>Jugadores</button><button onClick={()=>setSubTabPl('lideres')} className={`px-6 py-2 rounded-lg text-sm font-bold ${subTabPl==='lideres'?'bg-blue-600 text-white':'text-gray-400'}`}>Estadísticas</button></div></div>
                                            {subTabPl==='lideres' ? (
                                                <div className="flex flex-col items-center justify-center p-10 bg-black/40 rounded-xl border border-white/10"><div className="bg-yellow-500/20 p-4 rounded-full mb-4"><BarChart2 size={40} className="text-yellow-500"/></div><h3 className="text-xl font-bold text-white mb-2">En desarrollo</h3><p className="text-sm text-gray-400">Pronto las estadísticas.</p></div>
                                            ) : (
                                                <div className="space-y-10">
                                                    {Object.entries(POSITIONS).map(([code, cfg]) => {
                                                        const pl = data.filter(p => {
                                                            const pu = (p.puesto||"").toUpperCase();
                                                            return pu.includes(cfg.abbr) || pu.includes(code) || (code==="0ARQ"&&pu.includes("ARQ")) || (code==="1DEF"&&pu.includes("DEF")) || (code==="2MED"&&(pu.includes("MED")||pu.includes("VOL"))) || (code==="3DEL"&&pu.includes("DEL"));
                                                        });
                                                        if(pl.length===0) return null;
                                                        return (
                                                            <div key={code} className="w-full">
                                                                <div className={`w-full flex items-center gap-3 mb-6 px-4 py-3 ${cfg.color} bg-opacity-90 shadow-lg border-y border-white/20`}><cfg.icon size={24} className="text-white"/><h3 className="text-xl font-black uppercase tracking-widest text-white">{cfg.label}</h3></div>

                                                </div>

                                        </>

                                        {tab==='promedios' && <div className="flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-red-400"></span> Desciende</div>}
                                    </div>
                                </>
                            )}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
