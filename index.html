
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Widget CCAP - Cursos y Carreras</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    * { box-sizing: border-box; }
    html, body { width: 100%; margin: 0; padding: 0; overflow-x: hidden; }
    body { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f8fafc; color: #0f2742; }
    .ccap-wrap { width: 100%; max-width: none; margin: 0; padding: 14px; }
    body.embed { background: transparent; }
    body.embed .ccap-wrap { padding: 0; }
    .ccap-table { width: 100%; border-collapse: separate; border-spacing: 0 14px; table-layout: auto; }
    .ccap-table thead th { padding: 0 18px 8px; font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: .14em; color: #94a3b8; white-space: nowrap; }
    .ccap-row { background: #fff; box-shadow: 0 3px 18px rgba(15, 23, 42, .045); transition: box-shadow .2s ease, transform .2s ease; }
    .ccap-row:hover { box-shadow: 0 8px 28px rgba(15, 23, 42, .08); }
    .ccap-row td { padding: 18px 20px; vertical-align: middle; border-top: 1px solid rgba(226,232,240,.65); border-bottom: 1px solid rgba(226,232,240,.65); }
    .ccap-row td:first-child { border-left: 1px solid rgba(226,232,240,.65); border-radius: 22px 0 0 22px; width: 280px; min-width: 240px; }
    .ccap-row td:last-child { border-right: 1px solid rgba(226,232,240,.65); border-radius: 0 22px 22px 0; }
    .first-cell { min-height: 58px; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
    .career-title { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 15px; line-height: 1.22; font-weight: 850; letter-spacing: -.015em; }
    .plan-badge { display: inline-flex; align-items: center; width: fit-content; padding: 3px 8px; border-radius: 8px; font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: .08em; background: rgba(255,255,255,.24); border: 1px solid rgba(255,255,255,.24); }
    .badge-2x1 { display: inline-flex; align-items: center; justify-content: center; padding: 4px 10px; border-radius: 999px; font-size: 11px; line-height: 1; font-weight: 950; letter-spacing: .08em; text-transform: uppercase; background: #ef1746; color: #fff; border: 2px solid rgba(255,255,255,.78); box-shadow: 0 8px 18px rgba(239,23,70,.26); }
    .mobile-label { display: none; }
    .modality-pill { display: inline-flex; align-items: center; justify-content: center; padding: 8px 14px; border-radius: 999px; background: #f1f5f9; border: 1px solid #e2e8f0; color: #0f2742; font-size: 11px; font-weight: 800; white-space: nowrap; }
    .price { font-weight: 900; color: #061d36; font-size: 15px; white-space: nowrap; }
    .normal-text { color: #18324d; font-size: 14px; font-weight: 600; line-height: 1.45; white-space: pre-line; }
    .pdf-btn, .link-btn { display: inline-flex; align-items: center; gap: 7px; width: fit-content; border-radius: 999px; padding: 9px 14px; font-size: 12px; font-weight: 900; text-decoration: none; transition: transform .2s ease, box-shadow .2s ease; white-space: nowrap; }
    .pdf-btn { background: #fff1f2; color: #e11d48; border: 1px solid #fecdd3; }
    .link-btn { background: #009ee3; color: white; box-shadow: 0 8px 18px rgba(0,158,227,.22); }
    .pdf-btn:hover, .link-btn:hover { transform: translateY(-1px); }
    .controls { display: flex; gap: 12px; justify-content: space-between; align-items: center; margin-bottom: 18px; padding: 12px; border-radius: 22px; border: 1px solid #e2e8f0; background: rgba(255,255,255,.72); backdrop-filter: blur(16px); }
    .controls input { width: min(420px, 100%); border: 1px solid #e2e8f0; border-radius: 16px; padding: 13px 15px; font-weight: 700; outline: none; }
    .tab-btn { border: 0; cursor: pointer; padding: 11px 16px; border-radius: 14px; font-weight: 900; color: #475569; background: #f1f5f9; }
    .tab-btn.active { background: #0f172a; color: white; }
    .status-box { width: 100%; min-height: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 26px; border: 1px solid #e2e8f0; background: rgba(255,255,255,.78); text-align: center; padding: 30px; }
    .error-box { background: #fff1f2; border-color: #fecdd3; color: #be123c; }
    .header-with-icon { display: flex; align-items: center; gap: 9px; }
    .center-col { text-align: center; }
    .center-col .cell-content { display: flex; justify-content: center; }
    .cell-content { width: 100%; }
    @media (max-width: 900px) {
      .ccap-wrap { padding: 8px; }
      .controls { flex-direction: column; align-items: stretch; }
      .ccap-table, .ccap-table thead, .ccap-table tbody, .ccap-table tr, .ccap-table td { display: block; width: 100%; }
      .ccap-table { border-spacing: 0; }
      .ccap-table thead { display: none; }
      .ccap-row { margin-bottom: 16px; border-radius: 22px; overflow: hidden; display: block; }
      .ccap-row td, .ccap-row td:first-child, .ccap-row td:last-child { border-left: 1px solid rgba(226,232,240,.65); border-right: 1px solid rgba(226,232,240,.65); border-top: 0; border-bottom: 1px solid #eef2f7; border-radius: 0; width: 100%; min-width: 0; padding: 14px 16px; }
      .ccap-row td:first-child { border-top: 1px solid rgba(226,232,240,.65); border-radius: 22px 22px 0 0; padding: 18px; }
      .ccap-row td:last-child { border-radius: 0 0 22px 22px; }
      .mobile-cell { display: flex !important; align-items: center; justify-content: space-between; gap: 15px; }
      .mobile-label { display: flex; align-items: center; gap: 6px; color: #94a3b8; font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: .12em; min-width: 38%; }
      .cell-content { width: 62%; display: flex; justify-content: flex-end; text-align: right; }
      .center-col { text-align: right; }
      .center-col .cell-content { justify-content: flex-end; }
      .career-title { font-size: 16px; }
      .normal-text { font-size: 13px; }
      .price { font-size: 14px; }
    }
  </style>
</head>
<body>
  <div id="app" class="ccap-wrap"></div>

  <script>
    const URLS = {
      cursos: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ37C-OXiUfM2JeZj_91yhe71ZRwfwLh7Im3IbHytbEbHg-Mm2TWuahRDeuypJ6aXSKAYrU6hRDACJ3/pub?output=csv",
      carreras: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTXqijV2xBtqvXAv17EXrDpJfP67w8zklebNx1X87l4wS2dG4GicqnXD8G4TU5bFX1XSx-xhHmrrE82/pub?output=csv"
    };

    const params = new URLSearchParams(window.location.search);
    const isEmbed = params.get('embed') === 'true';
    const initialType = params.get('type') === 'carreras' ? 'carreras' : 'cursos';

    const state = {
      activeTab: initialType,
      headers: [],
      rows: [],
      loading: true,
      error: null,
      searchTerm: ''
    };

    if (isEmbed) document.body.classList.add('embed');

    function parseCSV(str) {
      const arr = [];
      let quote = false, row = 0, col = 0;
      for (let c = 0; c < str.length; c++) {
        const cc = str[c], nc = str[c + 1];
        arr[row] = arr[row] || [];
        arr[row][col] = arr[row][col] || '';
        if (cc === '"' && quote && nc === '"') { arr[row][col] += cc; c++; continue; }
        if (cc === '"') { quote = !quote; continue; }
        if (cc === ',' && !quote) { col++; continue; }
        if (cc === '\r' && nc === '\n' && !quote) { row++; col = 0; c++; continue; }
        if ((cc === '\n' || cc === '\r') && !quote) { row++; col = 0; continue; }
        arr[row][col] += cc;
      }
      return arr.filter(r => r.some(cell => String(cell || '').trim() !== ''));
    }

    async function fetchTextWithFallback(url) {
      const cacheBust = (url.includes('?') ? '&' : '?') + 't=' + Date.now();
      const direct = url + cacheBust;
      const candidates = [
        direct,
        'https://api.allorigins.win/raw?url=' + encodeURIComponent(direct),
        'https://corsproxy.io/?' + encodeURIComponent(direct)
      ];
      let lastError = null;
      for (const candidate of candidates) {
        try {
          const res = await fetch(candidate, { cache: 'no-store' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const text = await res.text();
          if (text && text.trim().length > 0) return text;
        } catch (err) { lastError = err; }
      }
      throw lastError || new Error('No se pudo leer el CSV.');
    }

    async function fetchData() {
      state.loading = true;
      state.error = null;
      render();
      try {
        const text = await fetchTextWithFallback(URLS[state.activeTab]);
        const data = parseCSV(text);
        if (!data.length) throw new Error('El CSV está vacío.');
        state.headers = data[0].map(h => String(h || '').trim());
        state.rows = data.slice(1);
      } catch (err) {
        state.error = err && err.message ? err.message : 'Failed to fetch';
      } finally {
        state.loading = false;
        render();
      }
    }

    function normalize(txt) {
      return String(txt || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function isHexColor(value) {
      return /^#(?:[0-9a-fA-F]{3}){1,2}$/.test(String(value || '').trim());
    }

    function expandHex(hex) {
      hex = String(hex || '').trim();
      if (/^#[0-9a-fA-F]{3}$/.test(hex)) {
        return '#' + hex[1] + hex[1] + hex[2] + hex[2] + hex[3] + hex[3];
      }
      return hex;
    }

    function getContrastColor(hex) {
      const clean = expandHex(hex).replace('#', '');
      if (clean.length !== 6) return '#ffffff';
      const r = parseInt(clean.slice(0, 2), 16);
      const g = parseInt(clean.slice(2, 4), 16);
      const b = parseInt(clean.slice(4, 6), 16);
      const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return luminance > 0.64 ? '#0f2742' : '#ffffff';
    }

    function parseFirstCell(raw) {
      const lines = String(raw || '')
        .split(/\r?\n/)
        .map(l => l.trim())
        .filter(Boolean);

      const hexLine = lines.find(isHexColor);
      const color = hexLine ? expandHex(hexLine) : null;

      const cleanLines = lines.filter(line => !isHexColor(line) && !/^2\s*x\s*1$/i.test(line));
      let name = cleanLines.join(' ').replace(/\b2\s*x\s*1\b/ig, '').replace(/\s{2,}/g, ' ').trim();
      if (!name) name = String(raw || '').replace(/\b2\s*x\s*1\b/ig, '').trim();

      return { name, color };
    }

    function rowHas2x1(row) {
      return row.some(cell => /\b2\s*x\s*1\b/i.test(String(cell || '')));
    }

    function headerIndexIncludes(wordList) {
      const words = Array.isArray(wordList) ? wordList : [wordList];
      return state.headers.findIndex(h => words.some(w => normalize(h).includes(normalize(w))));
    }

    function isHiddenColumn(header, index) {
      const h = normalize(header);
      // Ocultamos columnas auxiliares, pero seguimos usándolas para detectar color/2x1.
      return h.includes('color') || h.includes('hexa') || h.includes('hexadecimal') || h === '2x1' || h.includes('promocion');
    }

    function getRowColor(row, rowIndex, firstParsed) {
      if (firstParsed.color) return firstParsed.color;
      const colorIndex = headerIndexIncludes(['color', 'hexa', 'hexadecimal']);
      if (colorIndex !== -1 && isHexColor(row[colorIndex])) return expandHex(row[colorIndex]);
      const fallbackCarreras = ['#fd640f', '#829d3c', '#b98dc0', '#00abd6', '#a48f7a', '#3655a2', '#f2c118', '#b82e34'];
      const fallbackCursos = ['#F29C54', '#A6C28F', '#3E75C3'];
      return (state.activeTab === 'carreras' ? fallbackCarreras : fallbackCursos)[rowIndex % (state.activeTab === 'carreras' ? fallbackCarreras.length : fallbackCursos.length)];
    }

    function getHeaderIcon(headerText) {
      const text = normalize(headerText);
      const icon = (name, cls) => `<i data-lucide="${name}" class="${cls}" style="width:15px;height:15px;" stroke-width="2.6"></i>`;
      if (text.includes('carrera') || text.includes('curso') || text.includes('diplomatura')) return icon('graduation-cap', 'text-violet-500');
      if (text.includes('modalidad')) return icon('monitor', 'text-emerald-500');
      if (text.includes('inicio') || text.includes('fecha') || text.includes('dia')) return icon('calendar', 'text-blue-500');
      if (text.includes('horario') || text.includes('hora')) return icon('clock', 'text-orange-500');
      if (text.includes('duraci')) return icon('timer', 'text-rose-500');
      if (text.includes('docente')) return icon('user', 'text-violet-500');
      if (text.includes('precio') || text.includes('cuota') || text.includes('matricula') || text.includes('$') || text.includes('empresa') || text.includes('pago')) return icon('dollar-sign', 'text-emerald-500');
      if (text.includes('pdf') || text.includes('plan')) return icon('file-text', 'text-rose-500');
      return icon('check-circle', 'text-slate-400');
    }

    function isCenterAligned(header) {
      const h = normalize(header);
      return h.includes('precio') || h.includes('cuota') || h.includes('matricula') || h.includes('$') || h.includes('empresa') || h.includes('pago') || h.includes('pdf');
    }

    function formatMoney(text) {
      const original = String(text || '').trim();
      if (!original) return '';
      if (/https?:\/\//i.test(original)) return original;
      const numeric = original.replace(/[^\d]/g, '');
      if (!numeric) return original;
      return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(Number(numeric));
    }

    function renderCell(content, header) {
      const h = normalize(header);
      const text = String(content || '').trim();
      const urlRegex = /(https?:\/\/[^\s]+)/g;

      if (h.includes('modalidad')) {
        return `<span class="modality-pill">${escapeHTML(text)}</span>`;
      }

      if (urlRegex.test(text)) {
        const url = text.match(urlRegex)[0];
        const isPDF = h.includes('pdf') || h.includes('plan') || url.toLowerCase().includes('drive.google') || url.toLowerCase().endsWith('.pdf');
        return `<a href="${escapeAttr(url)}" target="_blank" rel="noopener noreferrer" class="${isPDF ? 'pdf-btn' : 'link-btn'}">${getHeaderIcon(isPDF ? 'pdf' : 'link')} ${isPDF ? 'Ver PDF' : 'Abrir link'}</a>`;
      }

      if (isCenterAligned(header) && text) return `<span class="price">${escapeHTML(formatMoney(text))}</span>`;
      return `<span class="normal-text">${escapeHTML(text)}</span>`;
    }

    function escapeHTML(str) {
      return String(str || '').replace(/[&<>'"]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[s]));
    }

    function escapeAttr(str) { return escapeHTML(str); }

    function visibleColumnIndexes() {
      return state.headers.map((h, i) => ({ h, i })).filter(({ h, i }) => !isHiddenColumn(h, i)).map(({ i }) => i);
    }

    function renderTable() {
      const term = normalize(state.searchTerm);
      const rows = state.rows.filter(row => !term || row.some(cell => normalize(cell).includes(term)));
      const indexes = visibleColumnIndexes();

      if (!rows.length) {
        return `<div class="status-box"><i data-lucide="search" style="width:42px;height:42px;color:#cbd5e1"></i><h3 class="mt-4 text-xl font-black text-slate-700">No se encontraron resultados</h3></div>`;
      }

      let html = `<table class="ccap-table"><thead><tr>`;
      indexes.forEach((idx) => {
        const header = state.headers[idx] || '';
        html += `<th class="${isCenterAligned(header) ? 'center-col' : ''}"><div class="header-with-icon ${isCenterAligned(header) ? 'justify-center' : ''}">${getHeaderIcon(header)}<span>${escapeHTML(header)}</span></div></th>`;
      });
      html += `</tr></thead><tbody>`;

      rows.forEach((row, rowIndex) => {
        const firstParsed = parseFirstCell(row[0]);
        const color = getRowColor(row, rowIndex, firstParsed);
        const contrast = getContrastColor(color);
        const has2x1 = rowHas2x1(row);
        const planIndex = headerIndexIncludes(['plan']);
        const planText = planIndex !== -1 ? String(row[planIndex] || '').trim() : '';

        html += `<tr class="ccap-row">`;
        indexes.forEach((idx) => {
          const header = state.headers[idx] || '';
          if (idx === 0) {
            html += `<td style="background:${escapeAttr(color)}; color:${contrast};">
              <div class="first-cell">
                <div class="career-title" style="color:${contrast};">
                  <span>${escapeHTML(firstParsed.name)}</span>
                  ${has2x1 ? '<span class="badge-2x1">2x1</span>' : ''}
                </div>
                ${planText && !/\b2\s*x\s*1\b/i.test(planText) ? `<span class="plan-badge" style="color:${contrast};">${escapeHTML(planText)}</span>` : ''}
              </div>
            </td>`;
          } else if (idx === planIndex) {
            // No mostramos plan como columna si ya se usa debajo del nombre.
          } else {
            html += `<td class="mobile-cell ${isCenterAligned(header) ? 'center-col' : ''}">
              <span class="mobile-label">${getHeaderIcon(header)} ${escapeHTML(header)}</span>
              <div class="cell-content">${renderCell(row[idx], header)}</div>
            </td>`;
          }
        });
        html += `</tr>`;
      });

      html += `</tbody></table>`;
      return html;
    }

    function renderControls() {
      if (isEmbed) return '';
      return `<div class="controls">
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="tab-btn ${state.activeTab === 'cursos' ? 'active' : ''}" onclick="switchType('cursos')">Cursos</button>
          <button class="tab-btn ${state.activeTab === 'carreras' ? 'active' : ''}" onclick="switchType('carreras')">Carreras</button>
        </div>
        <input id="search" type="text" placeholder="Buscar en ${state.activeTab}..." value="${escapeAttr(state.searchTerm)}" />
      </div>`;
    }

    function render() {
      const app = document.getElementById('app');
      let html = renderControls();
      if (state.loading) {
        html += `<div class="status-box"><i data-lucide="refresh-cw" class="animate-spin" style="width:42px;height:42px;color:#0f172a"></i><h3 class="mt-4 text-xl font-black text-slate-800">Sincronizando datos...</h3></div>`;
      } else if (state.error) {
        html += `<div class="status-box error-box"><i data-lucide="alert-triangle" style="width:42px;height:42px;color:#f43f5e"></i><h3 class="mt-4 text-xl font-black">Problema de conexión</h3><p class="mt-2 font-bold">${escapeHTML(state.error)}</p><button class="tab-btn active mt-5" onclick="fetchData()">Reintentar conexión</button></div>`;
      } else {
        html += renderTable();
      }
      app.innerHTML = html;

      if (!isEmbed) {
        const search = document.getElementById('search');
        if (search) search.addEventListener('input', e => { state.searchTerm = e.target.value; render(); });
      }
      if (window.lucide) lucide.createIcons();
    }

    window.switchType = function(type) {
      state.activeTab = type === 'carreras' ? 'carreras' : 'cursos';
      state.searchTerm = '';
      fetchData();
    };

    window.addEventListener('load', fetchData);
  </script>
</body>
</html>
