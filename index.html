        // --- HELPERS (BLINDADOS) ---
        const cleanString = (s) => (!s ? "" : String(s).replace(/\*/g, '').replace(/vs\./gi, '').replace(' (C)', '').trim());
        const shortName = (n) => { 
            if(!n) return ""; 
            const c=cleanString(n); 
            const map={"Argentinos Juniors":"AAAJ","Central Córdoba (SdE)":"CCO","Defensa y Justicia":"DYJ","Estudiantes (LP)":"EDLP","Gimnasia (LP)":"GELP","Gimnasia (M)":"GEM","Godoy Cruz":"GOD","Independiente Rivadavia":"CSIR","Independiente":"CAI","Newell's":"NOB","Rosario Central":"CARC","San Lorenzo":"CASL","San Martín (SJ)":"SMSJ","Sarmiento (J)":"SAR","Talleres (C)":"CAT","Atlético Tucumán":"CAT","Vélez Sarsfield":"VEL","Boca Juniors":"BOC","River Plate":"RIV","Racing Club":"RAC","Huracán":"HUR","Lanús":"LAN","Banfield":"BAN","Platense":"PLA","Instituto":"IACC","Belgrano":"CAB","Unión":"UNI","Tigre":"TIG","Barracas Central":"BAR","Deportivo Riestra":"RIE","Argentino de Merlo":"MERLO"}; 
            return map[c] || c.substring(0,3).toUpperCase(); 
        };
        const getTeamLogo = (n) => { 
            if(!n) return ASSETS.lpf; 
            const k=Object.keys(TEAM_LOGOS).find(k=>String(n).toLowerCase().includes(k.toLowerCase())); 
            return k?TEAM_LOGOS[k]:ASSETS.lpf; 
        };
        const getPlayerPhoto = (n) => { 
            if(!n) return null; 
            const k=Object.keys(PLAYER_PHOTOS).find(x=>String(n).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").includes(x)); 
            return k?PLAYER_PHOTOS[k]:null; 
        };
        const getLastName = (fn) => { const s=String(fn||"").trim().split(' '); return s.length>1?s[s.length-1]:s[0]; };

        // --- PARSER (DIRECTO Y ROBUSTO) ---
        const parseSheetData = (csv, type) => {
            if (!csv) return [];
            const lines = csv.split('\n').filter(l => l.trim() !== '');
            // Busqueda Header basica
            let hIdx = -1;
            const kw = { standings:['equipo','club','pos'], fixture:['fecha'], plantel:['jugador','nombre'] };
            const tKw = kw[type==='plantel'?'plantel':(type==='fixture'||type==='copaArgentina'?'fixture':'standings')];
            for(let i=0; i<Math.min(lines.length,20); i++) { if(tKw.some(k=>lines[i].toLowerCase().includes(k))) { hIdx=i; break; } }
            
            // Si no encuentra header, asumimos fila 0 o 1
            if(hIdx===-1) hIdx=0;

            const splitCSV = (str) => { const m=str.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g); return m?m.map(x=>x.replace(/^"|"$/g,'').trim()):str.split(','); };
            const rH = splitCSV(lines[hIdx]).map(x=>x.toLowerCase());

            // Estrategia: Si es Fixture o Copa, leer columnas fijas A,B,C,D,E pase lo que pase
            if(type === 'fixture' || type === 'copaArgentina') {
                // Empezamos despues del supuesto header, si existe
                return lines.slice(hIdx + 1).map(line => {
                     const vals = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v=>v.trim().replace(/^"|"$/g,''));
                     // Si la fila está vacía, saltar
                     if(vals.every(v=>v==='')) return null;
                     
                     const row = {};
                     let rawA=vals[0]||"", rawB=vals[1]||"", rawC=vals[2]||"", rawD=vals[3]||"", rawE=vals[4]||"";
                     
                     // Si no hay datos minimos en B y D, descartamos (salvo que sea la fila del titulo)
                     if(rawB==="" && rawD==="") return null;

                     let f=rawA, dh="";
                     if(rawA.includes(';')) { const p=rawA.split(';'); f=p[0].trim(); dh=p[1].trim(); }
                     row.fechaDisplay=f; row.diaHora=dh; row.local=cleanString(rawB); row.visitante=cleanString(rawD); row.resultado=cleanString(rawC); row.info=rawE;
                     row.fechaFull = f + (dh ? ` ${dh}` : "");
                     return row;
                }).filter(r=>r!==null);
            }

            return lines.slice(hIdx+1).map(line => {
                const vals = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v=>v.trim().replace(/^"|"$/g,''));
                if(vals.every(v=>v==='')) return null;
                const row = {};
                
                if(type.includes('apertura') || type==='anual' || type==='promedios') {
                    // Indices dinamicos o fallbacks fijos
                    let idxEq = rH.findIndex(h=>h.includes('equipo')||h.includes('club')); if(idxEq===-1) idxEq=1;
                    let idxPos = rH.findIndex(h=>h.includes('pos')||h.includes('#')); if(idxPos===-1) idxPos=0;
                    let idxPj = rH.findIndex(h=>h.includes('pj')||h.includes('jug')); if(idxPj===-1) idxPj=2;
                    
                    row.pos = cleanString(vals[idxPos]);
                    row.equipo = cleanString(vals[idxEq]);
                    row.pj = cleanString(vals[idxPj]);
                    
                    if(type==='promedios') {
                        // Col D (index 3) is Promedio strictly
                        row.prom = vals[3] || "0.000";
                        // Col H (index 7) is Pts strictly
                        row.pts = vals[7] || "0";
                    } else {
                        // Col Last is Pts usually
                        let idxPts = rH.findIndex(h=>h.includes('pts')||h.includes('punto')); if(idxPts===-1) idxPts=vals.length-1;
                        row.pts = cleanString(vals[idxPts]);
                        // Col Dif
                        let idxDif = rH.findIndex(h=>h.includes('dif')||h.includes('dg')); if(idxDif===-1) idxDif=vals.length-2; // aprox
                        row.dif = cleanString(vals[idxDif]);
                        row.prom = "0.000";
                    }
                } else {
                    let idxNom = rH.findIndex(h=>h.includes('nombre')||h.includes('jug')); if(idxNom===-1) idxNom=1;
                    let idxNum = rH.findIndex(h=>h.includes('num')||h.includes('dorsal')); if(idxNum===-1) idxNum=0;
                    let idxPue = rH.findIndex(h=>h.includes('puesto')||h.includes('pos')); if(idxPue===-1) idxPue=2;
                    let idxEdad = rH.findIndex(h=>h.includes('edad'));

                    row.nombre=cleanString(vals[idxNom]);
                    row.numero=cleanString(vals[idxNum]);
                    row.puesto=vals[idxPue];
                    let rawAge = idxEdad !== -1 ? vals[idxEdad] : null;
                    if(rawAge) rawAge=rawAge.replace(/\D/g,''); 
                    row.edad=rawAge;
                    if(!row.puesto && vals.length>3) row.puesto=vals.find(v=>Object.keys(POSITIONS).includes(v))||"1DEF";
                }
                return row;
            }).filter(r=>r!==null);
        };

        const CopyIcon = ({color,size}) => (<div style={{width:size,height:size*1.3,backgroundColor:color,borderRadius:1}}></div>);
        const EmptyState = () => (<div className="p-10 flex flex-col items-center text-center text-white/40"><AlertCircle size={32} className="mb-2 opacity-50"/><p>No hay datos disponibles.</p></div>);
        const StatBox = ({label, val, icon: IconC}) => (<div className="flex flex-col justify-center items-center py-1"><span className="text-white font-bold text-xs">{val}</span><div className="flex items-center gap-1 text-[8px] text-gray-300 uppercase font-bold">{IconC && <IconC size={8}/>}{label}</div></div>);

        const App = () => {
            const [mainTab, setMainTab] = useState('liga');
            const [subTab, setSubTab] = useState('apertura');
            const [aperturaZone, setAperturaZone] = useState('zonaA');
            const [plantelView, setPlantelView] = useState('jugadores');
            const [menuOpen, setMenuOpen] = useState(false);
            
            const [cache, setCache] = useState({});
            const [data, setData] = useState([]);
            const [zonaBData, setZonaBData] = useState([]);
            const [nextMatch, setNextMatch] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState("");
            const [selPlayer, setSelPlayer] = useState(null);
            const [ratingMatch, setRatingMatch] = useState(null);
            const [ratings, setRatings] = useState({});
            const [plantelFull, setPlantelFull] = useState([]);

            const fetchS = async (key, gid, type) => {
                if(cache[key]) return cache[key];
                try {
                    const res = await fetch(`${BASE_SHEET_URL}?gid=${gid}&single=true&output=csv&t=${Date.now()}`);
                    if(!res.ok) throw new Error("HTTP error");
                    const txt = await res.text();
                    const p = parseSheetData(txt, type);
                    setCache(prev=>({...prev, [key]:p}));
                    return p;
                } catch(e) {
                    console.error("Fetch failed", key, e);
                    // Return empty on fail to not break app
                    return [];
                }
            };

            const loadData = async (force = false) => {
                if (force) setCache({});
                setLoading(true); setError(""); setData([]); setZonaBData([]);
                try {
                    // Try to load plantel in background for ratings
                    if(plantelFull.length===0) {
                        fetchS('plantel', SHEET_IDS.plantel, 'plantel').then(p => setPlantelFull([...p, ...EXTRA_PLAYERS]));
                    }

                    if(mainTab === 'copa') {
                        const d = await fetchS('copaArgentina', SHEET_IDS.copaArgentina, 'copaArgentina');
                        setData(d);
                    } else if (mainTab === 'plantel') {
                        const d = await fetchS('plantel', SHEET_IDS.plantel, 'plantel');
                        setData([...d, ...EXTRA_PLAYERS]);
                    } else {
                        if(subTab === 'apertura') {
                            const [dA, dB] = await Promise.all([
                                fetchS('aperturaA', SHEET_IDS.aperturaA, 'aperturaA'),
                                fetchS('aperturaB', SHEET_IDS.aperturaB, 'aperturaB')
                            ]);
                            setData(dA); setZonaBData(dB);
                        } else {
                            const type = subTab === 'fixture' ? 'fixture' : (subTab === 'promedios' ? 'promedios' : 'anual');
                            const d = await fetchS(subTab, SHEET_IDS[subTab], type);
                            setData(d);
                        }
                    }
                } catch(e) { setError("No se pudieron cargar algunos datos."); }
                finally { setLoading(false); }
            };

            useEffect(() => { loadData(); }, [mainTab, subTab]);

            const handleShareRatings = () => {
                if(!ratingMatch) return;
                const rival = ratingMatch.local.includes('Talleres') ? ratingMatch.visitante : ratingMatch.local;
                let text = `Mis calificaciones del partido #Talleres vs ${cleanString(rival)} son:\n`;
                const scored = Object.entries(ratings).filter(([_, v]) => v !== "");
                if(scored.length === 0) return alert("Califica al menos a un jugador.");
                scored.forEach(([n, s]) => { text += `${getLastName(n)}: ${s}\n`; });
                text += `@TalleresMP`;
                window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`, '_blank');
                setRatingMatch(null); setRatings({});
            };

            const installApp = () => alert("Para instalar: \niOS: Botón Compartir -> Agregar a Inicio\nAndroid: Menú -> Instalar Aplicación");

            // --- HEADER DINAMICO ---
            const renderHeaderTitle = () => {
                if(mainTab === 'liga') return <div className="flex items-center gap-2"><img src={ASSETS.lpf} className="h-8"/> <h2 className="text-xl font-bold uppercase tracking-widest text-blue-200">Liga Profesional</h2></div>;
                if(mainTab === 'copa') return <div className="flex items-center gap-2"><img src={ASSETS.copa} className="h-8"/> <h2 className="text-xl font-bold uppercase tracking-widest text-blue-200">Copa Argentina</h2></div>;
                if(mainTab === 'plantel') return <div className="flex items-center gap-2"><Users className="h-6 w-6 text-blue-400"/> <h2 className="text-xl font-bold uppercase tracking-widest text-blue-200">Plantel Profesional</h2></div>;
            };

            const renderTable = (items, title) => {
                if(!items?.length) return <EmptyState />;
                const isProm = subTab === 'promedios';
                const isAnual = subTab === 'anual';
                const isAp = subTab === 'apertura';

                return (
                    <div className="bg-[#001e3d]/60 backdrop-blur-xl rounded-2xl border border-white/5 overflow-hidden shadow-xl mb-6">
                        {title && <div className="bg-blue-900/50 text-center py-2 text-sm font-bold text-blue-200 uppercase tracking-wider border-b border-white/10">{title}</div>}
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-black/20 text-xs text-blue-300 font-bold uppercase border-b border-white/5">
                                        <th className="p-3 text-center">#</th><th className="p-3">Club</th><th className="p-3 text-center">PJ</th>
                                        {isProm?<th className="p-3 text-center">Pts</th>:<th className="p-3 text-center">Dif</th>}
                                        <th className="p-3 text-center">{isProm?"Prom":"Pts"}</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-white/5 text-sm">
                                    {items.map((r,i)=>{
                                        if(!r.equipo)return null;
                                        const name=cleanString(r.equipo);
                                        const isT=name.includes("Talleres");
                                        const pos = i + 1; 
                                        const last=i===items.length-1;
                                        let cl=isT?"bg-blue-600/30 border-l-2 border-l-blue-500":"hover:bg-white/5";
                                        let pc="text-white/60";
                                        if(isAp && pos<=8){ if(!isT) cl="bg-green-500/10"; pc="text-green-400 font-bold"; }
                                        if(isAnual){
                                            if(pos<=4){if(!isT)cl="bg-yellow-500/10";pc="text-yellow-400 font-bold";}
                                            else if(pos<=9){if(!isT)cl="bg-gray-400/10";pc="text-gray-300 font-bold";}
                                            else if(last){if(!isT)cl="bg-red-500/10";pc="text-red-400 font-bold";}
                                        }
                                        if(isProm && last){if(!isT)cl="bg-red-500/10";pc="text-red-400 font-bold";}

                                        let promVal = r.prom;
                                        if(isProm) { const f = parseFloat(r.prom.replace(',','.')); if(!isNaN(f)) promVal = f.toFixed(3); }

                                        return (
                                            <tr key={i} className={`transition-colors ${cl}`}>
                                                <td className="p-3 text-center"><span className={pc}>{pos}</span></td>
                                                <td className="p-3 flex items-center gap-2"><img src={getTeamLogo(name)} className="h-6 w-6 object-contain"/><span className={`font-medium truncate ${isT?'text-white':'text-gray-300'}`}><span className="md:hidden">{shortName(name)}</span><span className="hidden md:inline">{name}</span></span></td>
                                                <td className="p-3 text-center text-white/60 font-mono">{r.pj}</td>
                                                <td className="p-3 text-center text-white/60 font-mono text-xs">{isProm?r.pts:r.dif}</td>
                                                <td className="p-3 text-center font-bold text-white font-mono">{isProm?promVal:r.pts}</td>
                                            </tr>
                                        )
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            const renderFixture = (isCopa) => {
                const valid = data.filter(m=>m.local && m.visitante);
                if (valid.length === 0) return <EmptyState />;
                return (
                    <div>
                        {isCopa && <div className="bg-blue-900/50 text-center py-2 mb-4 rounded-xl text-lg font-black text-blue-200 uppercase tracking-widest border border-white/10 shadow-lg">32VOS DE FINAL</div>}
                        <div className="space-y-4">
                            {valid.map((m,i)=>{
                                const isL=String(m.local).toLowerCase().includes('talleres');
                                const ln=cleanString(m.local), vn=cleanString(m.visitante);

                                    <div key={i} className="bg-[#001e3d]/40 border border-white/5 rounded-xl p-4">
                                        <div className="flex items-center justify-between mb-3">
                                            <div className="flex flex-col items-center w-1/3 text-center"><img src={getTeamLogo(ln)} className="h-10 w-10 mb-2 object-contain"/><span className={`text-xs font-bold leading-tight ${isL?'text-white':'text-gray-300'}`}><span className="md:hidden">{shortName(ln)}</span><span className="hidden md:inline">{ln}</span></span></div>

                                            <div className="flex flex-col items-center w-1/3 text-center"><img src={getTeamLogo(vn)} className="h-10 w-10 mb-2 object-contain"/><span className={`text-xs font-bold leading-tight ${!isL?'text-white':'text-gray-300'}`}><span className="md:hidden">{shortName(vn)}</span><span className="hidden md:inline">{vn}</span></span></div>
                                        </div>
                                        <div className="border-t border-white/10 pt-2 flex justify-between items-center px-1">
                                            <span className="text-[10px] text-blue-300 font-bold uppercase">{m.fechaDisplay}</span>
                                            <div className="flex gap-3">
                                                {m.diaHora && <span className="text-[10px] text-white/80 flex items-center gap-1">{m.diaHora}</span>}
                                                {m.info && <span className="text-[10px] text-gray-400 flex items-center gap-1">{m.info}</span>}
                                            </div>
                                        </div>
                                    </div>
                                )
                            })}
                        </div>
                    </div>
                )
            };

            const renderCard = (p,i) => {
                const name = cleanString(p.nombre);
                const photo = getPlayerPhoto(name);
                const pos = POSITIONS[p.puesto] || POSITIONS["1DEF"];
                return (
                    <div key={i} onClick={()=>setSelPlayer(p)} className="relative group w-full aspect-[3/4] rounded-xl overflow-hidden cursor-pointer shadow-lg border-2 border-gray-400">
                        {/* Background Image */}
                        <div className="absolute inset-0 z-0">
                             <img src="https://i.pinimg.com/736x/be/3a/8d/be3a8d0a562495d448da7bd373d05ab6.jpg" className="w-full h-full object-cover opacity-80" />
                             <div className="absolute inset-0 bg-black/40"></div>
                        </div>

                        <div className="absolute top-3 left-3 z-20 flex flex-col items-center text-gray-200 leading-none drop-shadow-md">
                            <span className="text-3xl font-black">{cleanString(p.numero)}</span>
                            <span className="text-[10px] font-bold uppercase mt-1">{pos.abbr}</span>
                        </div>
                        {p.edad && <div className="absolute top-3 right-3 z-20 text-white/80 leading-none font-black text-lg drop-shadow-md">{p.edad}</div>}
                        <img src={photo||ASSETS.placeholderUser} className={`absolute bottom-[3.5rem] left-1/2 -translate-x-1/2 h-[75%] object-cover z-10 drop-shadow-[0_5px_10px_rgba(0,0,0,0.8)] ${!photo?'opacity-30 grayscale p-4':''}`} onError={e=>{e.target.src=ASSETS.placeholderUser;e.target.classList.add('opacity-30','grayscale','p-4')}} />
                        <div className="absolute bottom-14 left-0 right-0 z-20 flex justify-center"><div className="bg-black/60 backdrop-blur-sm w-full py-1 text-center border-y border-white/10"><h3 className="text-white font-black text-sm uppercase tracking-tight whitespace-normal px-1 drop-shadow-lg">{name}</h3></div></div>
                        <div className="absolute bottom-0 left-0 right-0 h-14 bg-black/90 backdrop-blur-md z-20 grid grid-cols-5 divide-x divide-white/10 border-t border-gray-500/50">
                            <StatBox label="PJ" val="0" /><StatBox label="G" val="0" icon={Activity}/><StatBox label="A" val="0" icon={Footprints}/>
                            <StatBox val="0" icon={()=><CopyIcon color="yellow" size={8}/>} /><StatBox val="0" icon={()=><CopyIcon color="red" size={8}/>} />
                        </div>
                    </div>
                );
            };

            const renderPlantel = () => {
                const invalid = ["ARQUEROS","DEFENSORES","MEDIOCAMPISTAS","VOLANTES","DELANTEROS","VERANO","INVIERNO","BAJAS"];
                const valid = data.filter(p => {
                    const n = String(p.nombre||"").toUpperCase();
                    return !invalid.some(k=>n.includes(k)) && n.length > 2;
                });
                if(valid.length === 0) return <EmptyState />;

                return (
                    <div className="space-y-10">
                        {Object.entries(POSITIONS).map(([code, cfg]) => {
                            const pl = valid.filter(p => {
                                const pu = String(p.puesto||"").toUpperCase();
                                return pu.includes(cfg.abbr) || pu.includes(code) || (code==="0ARQ"&&pu.includes("ARQ")) || (code==="1DEF"&&pu.includes("DEF")) || (code==="2MED"&&(pu.includes("MED")||pu.includes("VOL"))) || (code==="3DEL"&&pu.includes("DEL"));
                            });
                            if(pl.length===0) return null;
                            return (
                                <div key={code} className="w-full">
                                    <div className={`w-full flex items-center gap-3 mb-6 px-4 py-3 ${cfg.color} bg-opacity-90 shadow-lg border-y border-white/20`}><cfg.icon size={24} className="text-white"/><h3 className="text-xl font-black uppercase tracking-widest text-white">{cfg.label}</h3></div>
                                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 px-2">{pl.map((p,i)=>renderCard(p,i))}</div>
                                </div>
                            )
                        })}
                        <div className="mt-12 border-t border-white/10 pt-8 px-2"><div className="w-full flex items-center gap-3 mb-6 px-4 py-3 bg-purple-600 bg-opacity-90 shadow-lg border-y border-white/20"><Users size={24} className="text-white"/><h3 className="text-xl font-black uppercase tracking-widest text-white">Cuerpo Técnico</h3></div><div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"><div className="relative group aspect-[3/4] rounded-xl overflow-hidden bg-gradient-to-b from-purple-900 to-black border-2 border-purple-400/50"><div className="absolute top-3 left-3 z-20 text-purple-400 font-black text-2xl">DT</div><img src={PLAYER_PHOTOS.tevez} className="absolute bottom-0 left-1/2 -translate-x-1/2 h-5/6 object-cover z-10"/><div className="absolute bottom-4 left-0 right-0 text-center z-20"><h3 className="text-white font-black text-lg">Carlos Tévez</h3></div></div><div className="relative group aspect-[3/4] rounded-xl overflow-hidden bg-gradient-to-b from-purple-900 to-black border-2 border-purple-400/50"><div className="absolute top-3 left-3 z-20 text-purple-400 font-black text-2xl">AC</div><img src={PLAYER_PHOTOS.perez} className="absolute bottom-0 left-1/2 -translate-x-1/2 h-5/6 object-cover z-10"/><div className="absolute bottom-4 left-0 right-0 text-center z-20"><h3 className="text-white font-black text-lg">Pablo Pérez</h3></div></div></div></div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen pb-20 md:pb-10">
                    {/* MODAL JUGADOR */}
                    {selPlayer && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md animate-in fade-in">
                            <div className="relative w-full max-w-sm bg-gradient-to-br from-gray-800 to-black border border-gray-500 rounded-2xl overflow-hidden shadow-2xl">
                                <button onClick={()=>setSelPlayer(null)} className="absolute top-4 right-4 z-50 bg-black/50 p-2 rounded-full text-white"><X size={24}/></button>
                                <div className="relative h-64 bg-gradient-to-b from-blue-900 to-transparent">
                                    <img src={getPlayerPhoto(cleanString(selPlayer.nombre))||ASSETS.placeholderUser} className="w-full h-full object-contain drop-shadow-2xl"/>
                                </div>
                                <div className="p-6 text-center -mt-10 relative z-10">
                                    <div className="bg-black/80 backdrop-blur-xl rounded-lg py-2 mb-4 inline-block px-4 border border-white/10 shadow-lg">
                                        <h2 className="text-2xl font-black text-white uppercase leading-none">{cleanString(selPlayer.nombre)}</h2>
                                    </div>
                                    <p className="text-gray-400 text-sm font-bold uppercase tracking-widest mb-6">{selPlayer.puesto}</p>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="bg-white/5 rounded-xl p-3 border border-white/10"><p className="text-xs text-gray-400">Goles</p><p className="text-2xl font-bold text-white">0</p></div>
                                        <div className="bg-white/5 rounded-xl p-3 border border-white/10"><p className="text-xs text-gray-400">Asistencias</p><p className="text-2xl font-bold text-white">0</p></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL CALIFICACION */}
                    {ratingMatch && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md animate-in fade-in">
                            <div className="relative w-full max-w-md bg-gray-900 border border-white/10 rounded-2xl overflow-hidden shadow-2xl max-h-[80vh] flex flex-col">
                                <div className="p-4 border-b border-white/10 flex justify-between items-center bg-gray-800">
                                    <div><h3 className="text-white font-bold">Calificar</h3><p className="text-xs text-gray-400">vs {cleanString(String(ratingMatch.visitante).includes('Talleres')?ratingMatch.local:ratingMatch.visitante)}</p></div>
                                    <button onClick={()=>setRatingMatch(null)} className="text-white"><X size={20}/></button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar">
                                    {plantelFull.length>0 ? plantelFull.filter(p=>!['ARQUEROS','DEFENSORES','MEDIOCAMPISTAS','DELANTEROS'].some(k=>String(p.nombre||"").toUpperCase().includes(k))).map((p,i) => {
                                        const nm = cleanString(p.nombre);
                                        return (
                                            <div key={i} className="flex items-center justify-between bg-white/5 p-2 rounded-lg border border-white/5">
                                                <div className="flex items-center gap-3"><img src={getPlayerPhoto(nm)||ASSETS.placeholderUser} className="w-8 h-8 rounded-full object-cover"/><p className="text-sm font-bold text-white">{nm}</p></div>
                                                <select className="bg-black/40 text-white text-sm border border-white/20 rounded p-1" onChange={(e)=>setRatings({...ratings, [nm]:e.target.value})}><option value="">-</option>{[...Array(10)].map((_,n)=><option key={n+1} value={n+1}>{n+1}</option>)}</select>
                                            </div>

                                    }) : <div className="text-center text-gray-500 py-10">Cargando...</div>}
                                </div>
                                <div className="p-4 border-t border-white/10 bg-gray-800">
                                    <button onClick={handleShareRatings} className="w-full py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-bold flex justify-center gap-2"><Twitter size={18}/> Compartir en Twitter</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Header */}
                    <header className="sticky top-0 z-40 bg-blue-900/95 backdrop-blur-md border-b border-white/10 shadow-lg">
                        <div className="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <button onClick={()=>setMenuOpen(!menuOpen)} className="md:hidden text-white"><Menu size={24}/></button>
                                <img src={ASSETS.logo} className="h-10 w-10 object-contain drop-shadow-md" />
                                <div>
                                    <div className="flex items-center gap-3">
                                        <h1 className="font-bold text-lg tracking-wide uppercase leading-none">Talleres mi pasión</h1>
                                        <div className="flex gap-2">
                                            <a href="https://www.facebook.com/TalleresMiPasion1913" target="_blank" className="text-blue-400 hover:text-white"><Facebook size={14}/></a>
                                            <a href="https://www.instagram.com/talleresmipasion" target="_blank" className="text-pink-400 hover:text-white"><Instagram size={14}/></a>
                                            <a href="https://x.com/TalleresMP" target="_blank" className="text-sky-400 hover:text-white"><Twitter size={14}/></a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div className="flex gap-2 items-center">
                                <button onClick={installApp} className="p-2 rounded-full hover:bg-white/5 transition-colors text-green-400 hidden md:block"><ArrowRight size={20}/></button>
                            </div>
                        </div>
                        {/* Desktop Nav */}
                        <div className="hidden md:flex justify-center bg-black/20 text-sm">
                            <button onClick={()=>{setMainTab('liga');setSubTab('apertura');}} className={`px-6 py-2 font-bold uppercase transition-colors ${mainTab==='liga'?'text-blue-400 border-b-2 border-blue-400':'text-gray-400 hover:text-white'}`}>Liga Profesional</button>
                            <button onClick={()=>setMainTab('copa')} className={`px-6 py-2 font-bold uppercase transition-colors ${mainTab==='copa'?'text-blue-400 border-b-2 border-blue-400':'text-gray-400 hover:text-white'}`}>Copa Argentina</button>
                            <button onClick={()=>setMainTab('plantel')} className={`px-6 py-2 font-bold uppercase transition-colors ${mainTab==='plantel'?'text-blue-400 border-b-2 border-blue-400':'text-gray-400 hover:text-white'}`}>Plantel</button>
                        </div>
                    </header>

                    {/* Mobile Menu */}
                    {menuOpen && (
                        <div className="fixed inset-0 z-50 flex">
                            <div className="fixed inset-0 bg-black/80" onClick={()=>setMenuOpen(false)}></div>
                            <div className="relative bg-gray-900 w-64 h-full p-6 shadow-2xl flex flex-col gap-6">
                                <div className="flex justify-between items-center mb-4"><h2 className="text-xl font-bold uppercase text-white">Menú</h2><button onClick={()=>setMenuOpen(false)}><X size={24}/></button></div>
                                <button onClick={()=>{setMainTab('liga');setSubTab('apertura');setMenuOpen(false);}} className={`text-left text-lg font-bold ${mainTab==='liga'?'text-blue-400':'text-gray-400'}`}>Liga Profesional</button>
                                <button onClick={()=>{setMainTab('copa');setMenuOpen(false);}} className={`text-left text-lg font-bold ${mainTab==='copa'?'text-blue-400':'text-gray-400'}`}>Copa Argentina</button>
                                <button onClick={()=>{setMainTab('plantel');setMenuOpen(false);}} className={`text-left text-lg font-bold ${mainTab==='plantel'?'text-blue-400':'text-gray-400'}`}>Plantel</button>
                                <div className="mt-auto pt-4 border-t border-white/10">
                                    <button onClick={installApp} className="w-full py-2 bg-green-600 text-white rounded font-bold flex justify-center gap-2"><ArrowRight size={18}/> Instalar App</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <main className="max-w-4xl mx-auto px-4 py-6">
                        
                        <div className="flex justify-center mb-6">{renderHeaderTitle()}</div>

                        {mainTab === 'liga' && (
                            <div className="overflow-x-auto pb-4 scrollbar-hide mb-2">
                                <div className="flex gap-2 min-w-max justify-center">
                                    {[{k:'apertura',l:'Apertura'},{k:'anual',l:'Anual'},{k:'promedios',l:'Promedios'},{k:'fixture',l:'Fixture'}].map(s=>(
                                        <button key={s.k} onClick={()=>setSubTab(s.k)} className={`px-4 py-1 rounded-full text-xs font-bold uppercase transition-all ${subTab===s.k?'bg-blue-600 text-white shadow-lg':'bg-white/10 text-gray-400'}`}>{s.l}</button>
                                    ))}
                                </div>
                            </div>
                        )}

                        <div className="animate-in fade-in slide-in-from-bottom-2 duration-300 min-h-[400px]">
                            {loading ? (
                                <div className="flex flex-col items-center justify-center h-64 space-y-4"><div className="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div><span className="text-sm text-blue-300 animate-pulse">Cargando datos...</span></div>
                            ) : error ? (
                                <div className="p-10 text-center text-red-400"><AlertCircle className="mx-auto mb-2"/><p>{error}</p></div>
                            ) : (
                                <>
                                    {mainTab==='liga' && subTab==='apertura' && (
                                        <>
                                            <div className="flex justify-center mb-6"><div className="bg-black/40 p-1 rounded-xl flex"><button onClick={()=>setAperturaZone('zonaA')} className={`px-6 py-2 rounded-lg text-sm font-bold ${aperturaZone==='zonaA'?'bg-blue-600 text-white':'text-gray-400'}`}>Zona A</button><button onClick={()=>setAperturaZone('zonaB')} className={`px-6 py-2 rounded-lg text-sm font-bold ${aperturaZone==='zonaB'?'bg-blue-600 text-white':'text-gray-400'}`}>Zona B</button></div></div>
                                            {renderTable(aperturaZone==='zonaA'?data:zonaBData)}
                                            <div className="p-4 bg-black/10 text-[10px] text-white/50 border border-white/5 rounded-xl flex flex-wrap gap-4 justify-center mt-6"><div className="flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-green-400"></span> Top 8: Octavos</div></div>
                                        </>
                                    )}
                                    {mainTab==='liga' && (subTab==='anual'||subTab==='promedios') && (
                                        <>
                                            {renderTable(data)}
                                            <div className="p-4 bg-black/10 text-[10px] text-white/50 border border-white/5 rounded-xl flex flex-wrap gap-4 justify-center mt-6">
                                                {subTab==='anual' && <><div className="flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-yellow-400"></span> Libertadores</div><div className="flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-gray-400"></span> Sudamericana</div><div className="flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-red-400"></span> Desciende</div></>}
                                                {subTab==='promedios' && <div className="flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-red-400"></span> Desciende</div>}
                                            </div>
                                        </>
                                    )}
                                    {mainTab==='liga' && subTab==='fixture' && renderFixture(false)}
                                    {mainTab==='copa' && renderFixture(true)}
                                    {mainTab==='plantel' && (
                                        <>
                                            <div className="flex justify-center mb-6"><div className="bg-black/40 p-1 rounded-xl flex"><button onClick={()=>setPlantelView('jugadores')} className={`px-6 py-2 rounded-lg text-sm font-bold ${plantelView==='jugadores'?'bg-blue-600 text-white':'text-gray-400'}`}>Jugadores</button><button onClick={()=>setPlantelView('lideres')} className={`px-6 py-2 rounded-lg text-sm font-bold ${plantelView==='lideres'?'bg-blue-600 text-white':'text-gray-400'}`}>Estadísticas</button></div></div>
                                            {plantelView==='lideres' ? (
                                                <div className="flex flex-col items-center justify-center p-10 bg-black/40 rounded-xl border border-white/10"><div className="bg-yellow-500/20 p-4 rounded-full mb-4"><BarChart2 size={40} className="text-yellow-500"/></div><h3 className="text-xl font-bold text-white mb-2">En desarrollo</h3><p className="text-sm text-gray-400">Pronto las estadísticas.</p></div>
                                            ) : renderPlantel()}
                                        </>
                                    )}
                                </>
                            )}
                        </div>
                        
                        <div className="mt-12 pt-6 border-t border-white/10 text-center">
                            <button onClick={()=>loadData(true)} className="text-xs text-blue-400 hover:text-white flex items-center justify-center gap-2 mx-auto"><RefreshCw size={12}/> Forzar Conexión de Datos</button>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
