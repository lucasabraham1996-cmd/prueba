<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background: transparent; }
    </style>
</head>
<body class="w-full h-full m-0 p-0">

    <!-- Aquí pegaré tu enlace por defecto para que funcione en GitHub Pages -->
    <script>
        const DEFAULT_SHEET_URL = "TU_ENLACE_AQUI"; 
    </script>

    <div id="app-root" class="w-full p-4">
        <div id="loading" class="text-slate-600 font-semibold text-center py-10">Cargando datos...</div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const sheetUrl = params.get('sheet') || DEFAULT_SHEET_URL;

        async function init() {
            const loadingDiv = document.getElementById('loading');
            if (sheetUrl === "TU_ENLACE_AQUI") {
                loadingDiv.innerHTML = "Error: Por favor, configura tu enlace CSV en el código.";
                return;
            }

            try {
                const res = await fetch(sheetUrl);
                if (!res.ok) throw new Error("No se pudo conectar al Google Sheet.");
                const data = await res.text();
                render(parseCSV(data));
            } catch (err) {
                loadingDiv.innerHTML = "Error: " + err.message + "<br>Asegúrate de que la hoja esté publicada como CSV.";
            }
        }

        function parseCSV(str) {
            return str.split('\n').filter(row => row.trim() !== '').map(row => 
                row.split(',').map(c => c.replace(/^"|"$/g, '').trim())
            );
        }

        function render(data) {
            const container = document.getElementById('app-root');
            const headers = data[0];
            const rows = data.slice(1);
            const colorIdx = headers.findIndex(h => h.trim().toLowerCase() === 'color');
            const planIdx = headers.findIndex(h => h.trim().toLowerCase().includes('plan'));
            
            let html = `<table class="w-full border-separate border-spacing-y-3">`;
            
            rows.forEach(row => {
                const color = (colorIdx !== -1 && row[colorIdx]) ? row[colorIdx].trim() : '#F3F4F6';
                const is2x1 = row.some(cell => cell.toLowerCase().includes('2x1'));
                const name = row[0];
                const plan = (planIdx !== -1 && row[planIdx]) ? row[planIdx] : '';

                html += `
                <tr class="bg-white shadow-sm hover:shadow-md transition-shadow border border-slate-100 rounded-2xl overflow-hidden">
                    <td style="background-color: ${color}" class="p-6 w-[30%]">
                        <div class="flex flex-col gap-2">
                            <span class="font-black text-lg text-slate-900">${name}</span>
                            <div class="flex gap-2 flex-wrap">
                                ${plan ? `<span class="bg-black/10 px-2 py-0.5 rounded text-[10px] font-bold uppercase text-slate-800">${plan}</span>` : ''}
                                ${is2x1 ? `<span class="bg-red-600 text-white px-2 py-0.5 rounded text-[10px] font-black uppercase animate-pulse">2x1</span>` : ''}
                            </div>
                        </div>
                    </td>
                    ${headers.map((h, i) => {
                        if (i === 0 || i === colorIdx || i === planIdx) return '';
                        return `<td class="p-6 text-sm font-semibold text-slate-700 border-l border-slate-50">${row[i] || '-'}</td>`;
                    }).join('')}
                </tr>`;
            });
            
            html += `</table>`;
            container.innerHTML = html;
        }

        window.onload = init;
    </script>
</body>
</html>
